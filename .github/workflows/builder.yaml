name: Build Discovery app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'Run privacy remediation build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml websockets

      - name: Sanitize public attribution and prepare Discovery 2.1.40
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sanitize_public_attribution.py --version 2.1.40
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('switch_vision_discovery/config.yaml'): ('version: "2.1.39"', 'version: "2.1.40"'),
              Path('runtime_src/run.sh'): ('SWITCH_VISION_DISCOVERY_VERSION="2.1.39"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.40"'),
              Path('runtime_src/discovery_job.sh'): ('SWITCH_VISION_DISCOVERY_VERSION="2.1.39"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.40"'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected version token missing in {path}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          sh tools/materialize_runtime.sh

      - name: Validate Discovery privacy remediation
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_public_attribution_privacy.py
          python tools/test_unifi_dashboard_failure_modes.py
          python tools/check_runtime_parity.py
          python tools/test_visual_contract_policy.py
          python tools/check_component_contracts.py
          python tools/check_speed_contracts.py
          python tools/check_hub_identity.py
          python tools/test_regenerate_yaml_contract.py
          sh -x runtime_src/self-test.sh
          python -m py_compile runtime_src/support_web.py runtime_src/registry_lookup.py runtime_src/vendor_sensor_scan.py runtime_src/unifi_dashboard_cards.py tools/sanitize_public_attribution.py tools/test_public_attribution_privacy.py
          find runtime_src tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          grep -Fq 'version: "2.1.40"' switch_vision_discovery/config.yaml
          git diff --check

      - name: Restore normal builder and remove temporary remediation files
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^^:.github/workflows/builder.yaml > .github/workflows/builder.yaml
          rm -f .github/workflows/prepare-public-attribution-policy.yml .privacy-remediation-trigger

      - name: Commit validated privacy remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Discovery v2.1.40: enforce public attribution privacy policy'
          git push origin HEAD:main
