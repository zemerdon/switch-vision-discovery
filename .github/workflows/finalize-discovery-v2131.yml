name: Finalize Discovery v2.1.31 handoff regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml websockets
      - name: Add final end-to-end regression
        run: python3 tools/finalize_discovery_v2131.py
      - name: Validate complete source runtime
        run: |
          set -euo pipefail
          bash -n runtime_src/run.sh
          bash -n runtime_src/discovery_job.sh
          bash runtime_src/self-test.sh
      - name: Rebuild packaged runtime
        run: |
          set -euo pipefail
          find runtime_src -type d -name __pycache__ -prune -exec rm -rf {} +
          find runtime_src -type f -name '*.pyc' -delete
          rm -f switch_vision_discovery/runtime.tar.gz
          tar -czf switch_vision_discovery/runtime.tar.gz -C runtime_src .
          python3 tools/check_runtime_parity.py
      - name: Validate final source hygiene
        run: |
          set -euo pipefail
          grep -q 'version: "2.1.31"' switch_vision_discovery/config.yaml
          grep -q 'Switch Vision Discovery v2.1.31 end-to-end Dell + S5720 current-run handoff: PASS' runtime_src/self-test.sh
          grep -q 'record_current_run_target \\' runtime_src/discovery_job.sh
          git diff --check
      - name: Commit finalized source back to PR branch
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f .github/workflows/finalize-discovery-v2131.yml tools/finalize_discovery_v2131.py
          git add -A
          git commit -m 'Finalize Switch Vision Discovery v2.1.31 handoff regression'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
