name: Build Discovery app

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for runtime tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install --disable-pip-version-check pyyaml websockets
      - name: Validate runtime source/archive parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_runtime_parity.py

      - name: Validate runtime archive hygiene
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          from pathlib import PurePosixPath
          import tarfile

          path = "./switch_vision_discovery/runtime.tar.gz"
          problems = []
          with tarfile.open(path, "r:gz") as archive:
              for member in archive.getmembers():
                  p = PurePosixPath(member.name)
                  if p.is_absolute() or ".." in p.parts:
                      problems.append(f"unsafe path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      problems.append(f"link/special entry: {member.name}")
                  if "__pycache__" in p.parts or p.suffix in {".pyc", ".pyo"}:
                      problems.append(f"Python bytecode/cache entry: {member.name}")
          if problems:
              for problem in problems:
                  print(f"ERROR: {problem}")
              raise SystemExit(1)
          print("Runtime archive hygiene: PASS")
          PY_AUDIT
      - name: Validate packaged Discovery runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/switch-vision-discovery-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          tar -xzf ./switch_vision_discovery/runtime.tar.gz -C "$runtime_dir"
          test -f "$runtime_dir/opt/switch-vision/devices/supported_devices.json"
          test -d "$runtime_dir/opt/switch-vision/mib_database"
          test -d "$runtime_dir/opt/switch-vision/vendors"
          python -m py_compile \
            "$runtime_dir/support_web.py" \
            "$runtime_dir/registry_lookup.py" \
            "$runtime_dir/vendor_sensor_scan.py" \
            "$runtime_dir/unifi_dashboard_cards.py"
          sh "$runtime_dir/self-test.sh"
      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@a7c616ce81ccda50150bf1595786c71b1883fabb
        with:
          path: ./switch_vision_discovery
      - name: Normalize app information
        id: normalize
        shell: bash
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.info.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.info.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "description=${{ steps.info.outputs.description }}" >> "$GITHUB_OUTPUT"
          echo "url=${{ steps.info.outputs.url }}" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build_validate:
    name: Validate build ${{ matrix.arch }}
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image without publishing
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./switch_vision_discovery
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: false
          version: ${{ needs.prepare.outputs.version }}

  build_publish:
    name: Publish build ${{ matrix.arch }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./switch_vision_discovery
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build_publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

  release_prepare_review:
    name: Prepare Discovery v2.1.35 release state
    if: github.event_name == 'pull_request' && github.head_ref == 'review/sv-2026-000002-registry-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out review branch with write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install release-prep dependencies
        run: python -m pip install --disable-pip-version-check pyyaml websockets
      - name: Build, validate, and commit Discovery 2.1.35
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          for path in [
              Path('switch_vision_discovery/config.yaml'),
              Path('runtime_src/run.sh'),
              Path('runtime_src/discovery_job.sh'),
              Path('runtime_src/self-test.sh'),
          ]:
              text = path.read_text(encoding='utf-8')
              if '2.1.34' not in text:
                  raise SystemExit(f'Expected 2.1.34 version marker missing from {path}')
              path.write_text(text.replace('2.1.34', '2.1.35'), encoding='utf-8', newline='\n')

          changelog = Path('switch_vision_discovery/CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          if not old.startswith('# Changelog\n\n## 2.1.34'):
              raise SystemExit('Unexpected Discovery changelog head')
          entry = dedent('''\
          ## 2.1.35

          - Synchronize the reviewed Core exact-model registry for Support My Switch contribution `SV-2026-000002` and preserve the validated Zyxel XS1930-10 contributor evidence.
          - Add UniFi API profiles for `US 48`, optical-first `US XG 16`, and 32-port optical `USW Pro Aggregation`.
          - Keep `US 48` on the existing legacy sequential 48-RJ45 + four-optical dashboard path as backward-compatibility coverage.
          - Recognize `US XG 16` and `USW Pro Aggregation` without generating fake dashboard cards while their exact faceplates remain unverified; generated output records that they are waiting for visuals.
          - Recognize SFP28 as an optical connector class and preserve 25G maximum capability separately from current negotiated link speed.
          - Forward explicit `unifi_api_port_map` metadata into generated cards when a future exact model is dashboard-enabled, while retaining `unifi_sfp_port_offset` compatibility.
          - Add packaged runtime regressions for the contribution registry, API profiles, pending-visual behavior, and generated-card contracts.

          ''')
          changelog.write_text('# Changelog\n\n' + entry + old[len('# Changelog\n\n'):], encoding='utf-8', newline='\n')
          PY

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C runtime_src . | gzip -n > switch_vision_discovery/runtime.tar.gz

          python tools/check_runtime_parity.py
          sh runtime_src/self-test.sh
          python -m py_compile \
            runtime_src/support_web.py \
            runtime_src/registry_lookup.py \
            runtime_src/vendor_sensor_scan.py \
            runtime_src/unifi_dashboard_cards.py

          grep -q '^version: "2.1.35"$' switch_vision_discovery/config.yaml
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION="2.1.35"' runtime_src/run.sh
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION="2.1.35"' runtime_src/discovery_job.sh
          find runtime_src -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          # Restore normal workflow state and remove all temporary preparation
          # machinery before creating the product commit.
          git checkout origin/main -- .github/workflows/builder.yaml
          rm -f .github/workflows/prepare-discovery-v2135-review.yml
          git diff --check

          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Switch Vision Discovery v2.1.35 public release'
          git push origin HEAD:review/sv-2026-000002-registry-sync
