      - api-port-{port}
      sfp_1g: []
      sfp_10g: []
    notes:
    - SV-2026-000057 confirms PoE output capability on ports 5-8 only.
    - PoE-active state is independent from Ethernet link state.

  ubiquiti-udm-pro-se-api:
    status: experimental
    vendor: Ubiquiti
    family: UniFi Dream Machine Pro SE
    model_patterns:
    - UniFi Dream Machine PRO SE
    - UDM Pro SE
    - UDM-Pro-SE
    layout:
      members: 1
      rj45_ports: 9
      sfp_1g_ports: 0
      sfp_10g_ports: 2
    interface_patterns:
      rj45:
      - api-port-{port}
      sfp_1g: []
      sfp_10g:
      - api-port-10
      - api-port-11
    notes:
    - SV-2026-000057 confirms ports 1-8 as 1G PoE RJ45, port 9 as 2.5G RJ45, and ports 10-11 as 10G SFP+.
    - Ports 9-11 remain role-neutral pending WAN/LAN role validation.

  dell-n2128px-on:
    status: experimental
    vendor: Dell
    family: Dell EMC Networking N2000
    model_patterns:
      - N2128PX-ON
      - Dell EMC Networking N2128PX-ON
    sys_object_ids:
      - 1.3.6.1.4.1.674.10895.3077
    layout:
      members: 1
      rj45_ports: 28
      sfp_1g_ports: 0
      sfp_10g_ports: 2
    interface_patterns:
      rj45:
        - Gi{member}/0/{port}
        - GigabitEthernet{member}/0/{port}
      sfp_1g: []
      sfp_10g:
        - Te{member}/0/1
        - Te{member}/0/2
        - TenGigabitEthernet{member}/0/1
        - TenGigabitEthernet{member}/0/2
    notes:
      - Profile derived from the Support My Switch Dell bundle received 2026-08-16.
      - The same sysObjectID and topology are present on firmware 6.7.1.27 and 6.6.0.7.
      - Gi<member>/0/1-28 map to 28 RJ45 ports per stack member.
      - Te<member>/0/1-2 map to two 10G SFP+ uplinks per stack member.
      - Standalone and two-member stack captures are both present in the contribution.
      - Generic 48 RJ45 + 4 SFP visual is temporary pending a Dell-specific faceplate.
