name: Prepare Discovery 2.4.19 faceplate matrix

on:
  push:
    branches:
      - fix/discovery-2.4.19-faceplate-matrix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/discovery-2.4.19-faceplate-matrix
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml websockets

      - name: Apply exact-model faceplate matrix
        run: python tools/apply_faceplate_matrix_2419.py

      - name: Materialize deterministic runtime archive
        run: sh tools/materialize_runtime.sh

      - name: Run faceplate regression
        run: python tools/test_faceplate_matrix_2419.py

      - name: Run runtime parity
        run: python tools/check_runtime_parity.py

      - name: Run component contracts against pending Core 2.7.9
        run: >-
          python tools/check_component_contracts.py
          --core-registry-url https://raw.githubusercontent.com/zemerdon/switch-vision-releases/fix/core-2.7.9-faceplate-matrix/src/devices/supported_devices.json
          --core-settings-url https://raw.githubusercontent.com/zemerdon/switch-vision-releases/fix/core-2.7.9-faceplate-matrix/src/custom_components/switch_vision/__init__.py

      - name: Run functional audit
        run: python tools/audit_functional_contracts.py

      - name: Remove generated Python cache material
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Run release check against pending Core 2.7.9
        shell: bash
        run: |
          set -euo pipefail
          checker="tools/check_component_contracts.py"
          backup="$RUNNER_TEMP/check_component_contracts.py"
          cp "$checker" "$backup"
          restore_checker() {
            cp "$backup" "$checker"
          }
          trap restore_checker EXIT
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/check_component_contracts.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "switch-vision-releases/main/src/devices/supported_devices.json":
                  "switch-vision-releases/fix/core-2.7.9-faceplate-matrix/src/devices/supported_devices.json",
              "switch-vision-releases/main/src/custom_components/switch_vision/__init__.py":
                  "switch-vision-releases/fix/core-2.7.9-faceplate-matrix/src/custom_components/switch_vision/__init__.py",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"pending Core contract patch target missing: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python tools/sv_release_check.py --mode release

      - name: Commit prepared Discovery 2.4.19 tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "Switch Vision SV-Dev"
          git config user.email "switch-vision@users.noreply.github.com"
          git add \
            runtime_src/opt/switch-vision/devices/supported_devices.json \
            runtime_src/run.sh \
            runtime_src/discovery_job.sh \
            runtime_src/self-test.sh \
            switch_vision_discovery/config.yaml \
            switch_vision_discovery/CHANGELOG.md \
            switch_vision_discovery/runtime.tar.gz
          git commit -m "Discovery 2.4.19: align exact-model faceplates"
          git push origin HEAD:fix/discovery-2.4.19-faceplate-matrix
