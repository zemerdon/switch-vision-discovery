name: Build Discovery v2.1.33 regenerate SNMP2MQTT YAML

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml websockets
      - name: Prepare Discovery v2.1.33
        run: python3 tools/prepare_discovery_v2133.py
      - name: Validate regeneration contract
        run: python3 tools/test_regenerate_yaml_contract.py
      - name: Validate runtime source
        run: |
          set -euo pipefail
          bash -n runtime_src/run.sh
          bash -n runtime_src/discovery_job.sh
          python3 -m py_compile runtime_src/support_web.py runtime_src/registry_lookup.py
          bash runtime_src/self-test.sh
      - name: Rebuild packaged runtime
        run: |
          set -euo pipefail
          find runtime_src -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find runtime_src -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete
          rm -f switch_vision_discovery/runtime.tar.gz
          tar -czf switch_vision_discovery/runtime.tar.gz -C runtime_src .
          python3 tools/check_runtime_parity.py
      - name: Validate release metadata and UI contract
        run: |
          set -euo pipefail
          grep -Fq 'version: "2.1.33"' switch_vision_discovery/config.yaml
          grep -Fq 'SWITCH_VISION_DISCOVERY_VERSION="2.1.33"' runtime_src/run.sh
          grep -Fq 'SWITCH_VISION_DISCOVERY_VERSION="2.1.33"' runtime_src/discovery_job.sh
          grep -Fq 'id="regenerateYamlButton"' runtime_src/support_web.py
          grep -Fq '/api/discovery/regenerate-yaml' runtime_src/support_web.py
          grep -Fq 'No new SNMP walks are performed.' runtime_src/support_web.py
          git diff --check
      - name: Commit final source back to feature branch
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f .github/workflows/build-discovery-v2133-regenerate-yaml.yml tools/prepare_discovery_v2133.py
          git add -A
          git commit -m 'Release Switch Vision Discovery v2.1.33'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
