name: Rebuild Discovery 2.1.37 runtime

on:
  push:
    branches:
      - fix/unifi-dashboard-card-errors-v2137

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-packager]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/unifi-dashboard-card-errors-v2137
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Apply 2.1.37 release metadata
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/SWITCH_VISION_DISCOVERY_VERSION="2\.1\.36"/SWITCH_VISION_DISCOVERY_VERSION="2.1.37"/' runtime_src/run.sh
          sed -i 's/SWITCH_VISION_DISCOVERY_VERSION="2\.1\.36"/SWITCH_VISION_DISCOVERY_VERSION="2.1.37"/' runtime_src/discovery_job.sh
          sed -i 's/version: "2\.1\.36"/version: "2.1.37"/' switch_vision_discovery/config.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('switch_vision_discovery/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 2.1.37\n'
          if heading not in text:
              entry = '''## 2.1.37

- Generate a Switch Vision dashboard card for positively detected UniFi switching devices even when no exact model registry entry exists yet.
- Use the smallest suitable existing stock/generic faceplate (24+2, 24+4, 48+2, or 48+4) while preserving the real observed RJ45/SFP counts and live UniFi port data.
- Apply the same generic fallback to registered UniFi models whose exact dashboard visuals are still pending, so artwork no longer gates dashboard availability.
- Keep exact registered/model-specific faceplates and API port maps unchanged when their verified geometry matches the observed device.
- Make malformed UniFi snapshot/registry inputs visible with YAML-safe diagnostics instead of silently returning zero cards.
- Add permanent regression coverage for Brendan's unsupported-model case: UCG Ultra, US 16 PoE 150W, USW Pro Max 24, and USW Ultra must produce four generic cards rather than an empty dashboard.

'''
              marker = '# Changelog\n\n'
              if not text.startswith(marker):
                  raise SystemExit('Unexpected changelog header')
              text = marker + entry + text[len(marker):]
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Run UniFi dashboard regression
        run: python tools/test_unifi_dashboard_failure_modes.py

      - name: Rebuild packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f switch_vision_discovery/runtime.tar.gz
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf switch_vision_discovery/runtime.tar.gz -C runtime_src .

      - name: Validate source/archive parity
        run: python tools/check_runtime_parity.py

      - name: Commit packaged release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Switch Vision Runtime Packager'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add runtime_src/run.sh runtime_src/discovery_job.sh switch_vision_discovery/config.yaml switch_vision_discovery/CHANGELOG.md switch_vision_discovery/runtime.tar.gz
          if git diff --cached --quiet; then
            echo 'No runtime packaging changes required.'
            exit 0
          fi
          git commit -m '[runtime-packager] Discovery 2.1.37 runtime package'
          git push origin HEAD:fix/unifi-dashboard-card-errors-v2137
