name: Temporary bootstrap Discovery v2.1.41 review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/sv-2026-000020-c3750'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: review/sv-2026-000020-c3750
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install preparation dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Run reviewed 2.1.41 preparation script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/temp-apply-v2141-review.yml > /tmp/v2141-helper.yml
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/v2141-helper.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = src[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          Path('/tmp/apply_v2141.py').write_text('\n'.join(line[indent:] for line in body) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_v2141.py

      - name: Commit prepared review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Prepare Switch Vision Discovery v2.1.41 Catalyst 3750 and mail fix'
          git push origin HEAD:review/sv-2026-000020-c3750
