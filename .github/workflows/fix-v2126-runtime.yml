name: Repair Discovery v2.1.26 runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/discovery-2.1.26-audit-contracts' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Repair version contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path('runtime_src/run.sh')
          run_text = run_path.read_text(encoding='utf-8')
          old = 'SWITCH_VISION_DISCOVERY_VERSION="2.1.24"'
          new = 'SWITCH_VISION_DISCOVERY_VERSION="2.1.26"'
          if old in run_text:
              if run_text.count(old) != 1:
                  raise SystemExit(f'ERROR: unexpected run.sh old-version count: {run_text.count(old)}')
              run_text = run_text.replace(old, new)
              run_path.write_text(run_text, encoding='utf-8')
          elif new not in run_text:
              raise SystemExit('ERROR: run.sh has neither expected 2.1.24 nor 2.1.26 version marker')

          test_path = Path('runtime_src/self-test.sh')
          test_text = test_path.read_text(encoding='utf-8')
          old_assert = "grep -q 'SWITCH_VISION_DISCOVERY_VERSION=\"2.1.24\"'"
          new_assert = "grep -q 'SWITCH_VISION_DISCOVERY_VERSION=\"2.1.26\"'"
          count = test_text.count(old_assert)
          if count:
              if count != 2:
                  raise SystemExit(f'ERROR: unexpected self-test old-version assertion count: {count}')
              test_text = test_text.replace(old_assert, new_assert)
              test_path.write_text(test_text, encoding='utf-8')
          elif test_text.count(new_assert) != 2:
              raise SystemExit('ERROR: self-test does not contain exactly two 2.1.26 version assertions')
          PY

      - name: Repack runtime only when parity changed
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/check_runtime_parity.py; then
            echo 'Runtime archive already matches source.'
          else
            rm -f switch_vision_discovery/runtime.tar.gz
            tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
              -C runtime_src -czf switch_vision_discovery/runtime.tar.gz .
            python3 tools/check_runtime_parity.py
          fi

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git add runtime_src/run.sh runtime_src/self-test.sh switch_vision_discovery/runtime.tar.gz
          if git diff --cached --quiet; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Discovery 2.1.26 packaged runtime version contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
