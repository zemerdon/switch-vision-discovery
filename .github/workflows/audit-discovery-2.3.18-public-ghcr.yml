name: Verify Discovery GHCR 2.3.18

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c4ac044db3a9a09392a601a8c6831e2e7e
      - name: Verify public Discovery 2.3.18 image
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/zemerdon/switch-vision-discovery:2.3.18'
          output=''
          for attempt in $(seq 1 20); do
            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              break
            fi
            echo "Public image not readable yet (attempt $attempt/20)."
            sleep 15
          done
          printf '%s\n' "$output"
          grep -Fq 'linux/amd64' <<<"$output"
          grep -Fq 'linux/arm64' <<<"$output"
          echo 'Discovery 2.3.18 public GHCR multi-arch verification: PASS'
