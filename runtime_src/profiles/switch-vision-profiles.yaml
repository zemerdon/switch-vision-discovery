      sfp_10g:
      - api-port-25
      - api-port-26
    notes:
    - SV-2026-000057 confirms ports 25-26 as 10G SFP+.
    - This profile intentionally differs from USW-24-PoE, whose two uplinks are 1G SFP.

  ubiquiti-us-8-60w-api:
    status: experimental
    vendor: Ubiquiti
    family: UniFi Switch 8 60W
    model_patterns:
    - US 8 60W
    - US-8-60W
    layout:
      members: 1
      rj45_ports: 8
      sfp_1g_ports: 0
      sfp_10g_ports: 0
    interface_patterns:
