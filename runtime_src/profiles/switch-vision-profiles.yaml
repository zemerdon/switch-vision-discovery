      sfp_1g: []
      sfp_10g: []
    notes:
    - SV-2026-000057 contains three independent live devices with the same five-port layout.
    - No PoE-output port mask is exposed for this exact model.

  ubiquiti-usw-pro-24-api:
    status: experimental
    vendor: Ubiquiti
    family: UniFi Switch Pro 24
    model_patterns:
    - USW Pro 24
    - USW-Pro-24
    layout:
