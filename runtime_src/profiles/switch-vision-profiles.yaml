      - GigabitEthernet0/0/10
      - GigabitEthernet0/0/11
      - GigabitEthernet0/0/12
      sfp_10g: []
    notes:
    - Profile derived from independent Support My Switch community contributions.
    - Community hardware evidence confirms an ifDescr-only IF-MIB layout with GigabitEthernet0/0/1-12.
    - Ports 1-8 are mapped as RJ45 and ports 9-12 as 1G SFP positions for this exact
      model.
    - Dashboard uses the generic 48 RJ45 + 4 SFP fallback visual until a smaller generic
      faceplate is supplied.
    - Physical 1G SFP cages 9-12 are capped at 1000 Mbps for generated speed telemetry
      even if IF-MIB reports a higher capability value.
    physical_speed_caps_mbps:
      sfp_1g: 1000
