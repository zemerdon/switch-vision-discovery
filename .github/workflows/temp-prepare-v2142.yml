name: Temporary prepare Discovery 2.1.42

on:
  push:
    branches: [main]
    paths:
      - .github/v2142-trigger.txt

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/discovery-2.1.42-c3750-profile
          fetch-depth: 0
      - name: Apply Discovery 2.1.42 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path, old, new):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, minimum=1):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'expected >= {minimum} occurrence(s) in {path}, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Version contract.
          replace_once('switch_vision_discovery/config.yaml', 'version: "2.1.41"', 'version: "2.1.42"')
          replace_once('runtime_src/run.sh', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.41"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.42"')
          replace_once('runtime_src/discovery_job.sh', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.41"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.42"')

          # Normalized capability classifier: WS-C3750-48P has FastEthernet copper,
          # while Gi<member>/0/1-4 are the four physical 1G SFP cages.
          replace_once(
              'runtime_src/opt/switch-vision/vendors/interface.sh',
              '    *C2960S*|*C2960X*)\n',
              '''    *C3750-48P*)
      CV_CAP_FRONT_PANEL_AWARE="true"
      CV_CAP_PLATFORM="c3750_48p"
      CV_CAP_RJ45_LIMIT="48"
      ;;
    *C2960S*|*C2960X*)
''')
          replace_once(
              'runtime_src/opt/switch-vision/vendors/interface.sh',
              '''      if [ "${CV_CAP_FRONT_PANEL_AWARE:-false}" = "true" ]; then
''',
              '''      if [ "${CV_CAP_PLATFORM:-generic}" = "c3750_48p" ]; then
        case "$short_name" in
          [0-9]*/0/[1-4]) printf 'sfp' ;;
          *) printf 'other' ;;
        esac
        return 0
      fi

      if [ "${CV_CAP_FRONT_PANEL_AWARE:-false}" = "true" ]; then
''')

          dj = ROOT / 'runtime_src/discovery_job.sh'
          text = dj.read_text(encoding='utf-8')

          # Exact non-X Catalyst 3750 identification in both report and generator AWK.
          old_regex = 'WS-C(3650|3750X|3560CG|2960X|2960S)-[A-Z0-9-]+'
          new_regex = 'WS-C(3650|3750X|3750|3560CG|2960X|2960S)-[A-Z0-9-]+'
          if text.count(old_regex) < 4:
              raise SystemExit(f'expected Catalyst model regex >=4 times, found {text.count(old_regex)}')
          text = text.replace(old_regex, new_regex)

          text = text.replace(
              '      if (model ~ /^WS-C3750X/) return "experimental"\n',
              '      if (model ~ /^WS-C3750-48P/) return "experimental"\n      if (model ~ /^WS-C3750X/) return "experimental"\n',
              1,
          )

          # Parser/report: classify exact 3750 copper and optical interfaces before
          # the generic Gi x/0 rule can turn the SFP cages into RJ45 ports.
          parser_anchor = '''        if (model == "SG500X-24" && n ~ /^gi1\\/[0-9]+$/) {
'''
          if parser_anchor not in text:
              raise SystemExit('missing parser special-classification anchor')
          parser_insert = '''        if (model == "WS-C3750-48P" && n ~ /^(Fa|FastEthernet)[0-9]+\\/0\\/([1-9]|[1-3][0-9]|4[0-8])$/) {
          c3750_key = n
          sub(/^FastEthernet/, "", c3750_key)
          sub(/^Fa/, "", c3750_key)
          split(c3750_key, cp, "/")
          member = cp[1] + 0
          port = cp[3] + 0
          physical_id = "Fa" member "/0/" port
          if (!(physical_id in physical_key)) {
            physical_key[physical_id] = 1; rj45_key[physical_id] = 1
            member_key[member] = 1; member_physical[member]++; member_rj45[member]++
          }
          special = 1
        } else if (model == "WS-C3750-48P" && n ~ /^(Gi|GigabitEthernet)[0-9]+\\/0\\/[1-4]$/) {
          c3750_key = n
          sub(/^GigabitEthernet/, "", c3750_key)
          sub(/^Gi/, "", c3750_key)
          split(c3750_key, cp, "/")
          member = cp[1] + 0
          port = cp[3] + 0
          physical_id = "Gi" member "/0/" port
          if (!(physical_id in physical_key)) {
            physical_key[physical_id] = 1; sfp_key[physical_id] = 1
            member_key[member] = 1; member_physical[member]++; member_sfp[member]++
          }
          special = 1
        } else if (model == "SG500X-24" && n ~ /^gi1\\/[0-9]+$/) {
'''
          text = text.replace(parser_anchor, parser_insert, 1)

          text = text.replace(
              '''      } else if (model == "XS1930-10") {
        print "- RJ45 swp00-swp07 ports: " rj45
''',
              '''      } else if (model == "WS-C3750-48P") {
        print "- RJ45 FastEthernet <member>/0/1-48 ports: " rj45
        print "- 1G SFP GigabitEthernet <member>/0/1-4 uplinks: " sfp_gi
      } else if (model == "XS1930-10") {
        print "- RJ45 swp00-swp07 ports: " rj45
''',
              1,
          )
          text = text.replace(
              '      else if (model ~ /^WS-C3750X-24P/) profile = "cisco-3750x-24p"\n',
              '      else if (model ~ /^WS-C3750-48P/) profile = "cisco-3750-48p-48fe-4sfp"\n      else if (model ~ /^WS-C3750X-24P/) profile = "cisco-3750x-24p"\n',
              1,
          )

          mapping_anchor = '''        if (model == "N2128PX-ON" && name ~ /^(Gi|GigabitEthernet|Te|TenGigabitEthernet)[0-9]+\\/0\\/[0-9]+$/) {
'''
          if mapping_anchor not in text:
              raise SystemExit('missing parser mapping-report anchor')
          mapping_insert = '''        if (model == "WS-C3750-48P" && name ~ /^(Fa|FastEthernet)[0-9]+\\/0\\/([1-9]|[1-3][0-9]|4[0-8])$/) {
          c3750_key = name
          sub(/^FastEthernet/, "", c3750_key)
          sub(/^Fa/, "", c3750_key)
          split(c3750_key, cp, "/")
          mapped_rows++; print "  - ifIndex " idx " -> " name " -> member " (cp[1] + 0) " RJ45 FastEthernet port " (cp[3] + 0)
          continue
        }
        if (model == "WS-C3750-48P" && name ~ /^(Gi|GigabitEthernet)[0-9]+\\/0\\/[1-4]$/) {
          c3750_key = name
          sub(/^GigabitEthernet/, "", c3750_key)
          sub(/^Gi/, "", c3750_key)
          split(c3750_key, cp, "/")
          mapped_rows++; print "  - ifIndex " idx " -> " name " -> member " (cp[1] + 0) " 1G SFP uplink " (cp[3] + 0)
          continue
        }
        if (model == "N2128PX-ON" && name ~ /^(Gi|GigabitEthernet|Te|TenGigabitEthernet)[0-9]+\\/0\\/[0-9]+$/) {
'''
          text = text.replace(mapping_anchor, mapping_insert, 1)

          text = text.replace(
              '      else if (model ~ /^WS-C3750X/) print "- WARN: Catalyst 3750X model detected; possible/experimental only, not supported"\n',
              '      else if (model ~ /^WS-C3750-48P/) print "- INFO: Catalyst 3750 Experimental exact 48 FastEthernet + 4 x 1G SFP mapping loaded"\n      else if (model ~ /^WS-C3750X/) print "- WARN: Catalyst 3750X model detected; possible/experimental only, not supported"\n',
              1,
          )
          ready_old = '((model ~ /^WS-C3650/ || model ~ /^WS-C3750X/ || is_2960(model)) && if_total > 0 && physical_if > 0 && trunk_status_count > 0)'
          ready_new = '((model ~ /^WS-C3650/ || model ~ /^WS-C3750X/ || is_2960(model)) && if_total > 0 && physical_if > 0 && trunk_status_count > 0) || (model == "WS-C3750-48P" && if_total > 0 && stack_member_count > 0 && rj45 == (48 * stack_member_count) && sfp_gi == (4 * stack_member_count))'
          if ready_old not in text:
              raise SystemExit('missing parser ready expression')
          text = text.replace(ready_old, ready_new, 1)
          text = text.replace(
              '''      } else if (model ~ /^WS-C3750X-24P/) {
        print "- Suggested profile: cisco-3750x-24p"
''',
              '''      } else if (model ~ /^WS-C3750-48P/) {
        print "- Suggested profile: cisco-3750-48p-48fe-4sfp"
        print "- Confidence: experimental; exact 48 FastEthernet + 4 x 1G SFP physical contract"
        print "- Support status: experimental / field revalidation required"
      } else if (model ~ /^WS-C3750X-24P/) {
        print "- Suggested profile: cisco-3750x-24p"
''',
              1,
          )

          # Generator model marker and exact-model selection.
          text = text.replace(
              '      if (line ~ /N2128PX-ON/) dell_model="N2128PX-ON"\n',
              '      if (line ~ /N2128PX-ON/) dell_model="N2128PX-ON"\n      if (line ~ /WS-C3750-48P/) c3750_model="WS-C3750-48P"\n',
              1,
          )
          text = text.replace(
              '      else if (dell_model != "") {\n        model = dell_model\n        manufacturer = "Dell"\n      }\n      else if (local_model != "") model = local_model\n',
              '      else if (dell_model != "") {\n        model = dell_model\n        manufacturer = "Dell"\n      }\n      else if (c3750_model != "") model = c3750_model\n      else if (local_model != "") model = local_model\n',
              1,
          )

          physical_count_anchor = '''        if (sg500_model != "" && val ~ /^(gi|te)1\\/[0-9]+$/) {
'''
          if physical_count_anchor not in text:
              raise SystemExit('missing generator physical-count anchor')
          physical_count_insert = '''        if (c3750_model != "" && val ~ /^(Fa|FastEthernet)[0-9]+\\/0\\/([1-9]|[1-3][0-9]|4[0-8])$/) {
          physical_count++
          c3750_key=val
          sub(/^FastEthernet/, "", c3750_key)
          sub(/^Fa/, "", c3750_key)
          split(c3750_key, c3750_parts, "/")
          physical_member[c3750_parts[1] + 0] = 1
        } else if (c3750_model != "" && val ~ /^(Gi|GigabitEthernet)[0-9]+\\/0\\/[1-4]$/) {
          physical_count++
          c3750_key=val
          sub(/^GigabitEthernet/, "", c3750_key)
          sub(/^Gi/, "", c3750_key)
          split(c3750_key, c3750_parts, "/")
          physical_member[c3750_parts[1] + 0] = 1
        } else if (sg500_model != "" && val ~ /^(gi|te)1\\/[0-9]+$/) {
'''
          text = text.replace(physical_count_anchor, physical_count_insert, 1)

          label_anchor = '''      if (model == "N2128PX-ON" && name ~ /^(Gi|GigabitEthernet|Te|TenGigabitEthernet)[0-9]+\\/0\\/[0-9]+$/) {
'''
          if label_anchor not in text:
              raise SystemExit('missing generator physical-label anchor')
          label_insert = '''      if (model == "WS-C3750-48P" && name ~ /^(Fa|FastEthernet)[0-9]+\\/0\\/([1-9]|[1-3][0-9]|4[0-8])$/) {
        key=name
        sub(/^FastEthernet/, "", key)
        sub(/^Fa/, "", key)
        split(key, parts, "/")
        return member_label(parts[1] + 0) " Port " (parts[3] + 0)
      }
      if (model == "WS-C3750-48P" && name ~ /^(Gi|GigabitEthernet)[0-9]+\\/0\\/[1-4]$/) {
        key=name
        sub(/^GigabitEthernet/, "", key)
        sub(/^Gi/, "", key)
        split(key, parts, "/")
        return member_label(parts[1] + 0) " SFP 1G " (parts[3] + 0)
      }
      if (model == "N2128PX-ON" && name ~ /^(Gi|GigabitEthernet|Te|TenGigabitEthernet)[0-9]+\\/0\\/[0-9]+$/) {
'''
          text = text.replace(label_anchor, label_insert, 1)

          text = text.replace(
              '''      if (model == "S5720-12TP-LI-AC" && label ~ /(^| )SFP 1G /) return 1000
      return 0
''',
              '''      if (model == "S5720-12TP-LI-AC" && label ~ /(^| )SFP 1G /) return 1000
      if (model == "WS-C3750-48P" && label ~ / Port /) return 100
      if (model == "WS-C3750-48P" && label ~ / SFP 1G /) return 1000
      return 0
''',
              1,
          )

          phys_condition = '(model == "SG500X-24" && name ~ /^(gi|te)1\\/[0-9]+$/)'
          if phys_condition not in text:
              raise SystemExit('missing generator physical-list condition')
          text = text.replace(
              phys_condition,
              '(model == "WS-C3750-48P" && name ~ /^(Fa|FastEthernet)[0-9]+\\/0\\/([1-9]|[1-3][0-9]|4[0-8])$/) || (model == "WS-C3750-48P" && name ~ /^(Gi|GigabitEthernet)[0-9]+\\/0\\/[1-4]$/) || ' + phys_condition,
              1,
          )

          # Generated dashboard card must point the four uplink positions at 1G SFP entities.
          text = text.replace(
              '*S5720-12TP-LI-AC*) echo "        sfp_status_entity_template: sensor.${safe_prefix}_sfp_1g_{port}_status" ;;',
              '*S5720-12TP-LI-AC*|*WS-C3750-48P*) echo "        sfp_status_entity_template: sensor.${safe_prefix}_sfp_1g_{port}_status" ;;',
          )

          dj.write_text(text, encoding='utf-8')

          # Generic registry -> real profile referential integrity.
          ccp = ROOT / 'tools/check_component_contracts.py'
          ctext = ccp.read_text(encoding='utf-8')
          old = '''    discovery_registry_path = Path(
        "runtime_src/opt/switch-vision/devices/supported_devices.json"
    )
'''
          new = old + '''    discovery_profiles_path = Path("runtime_src/profiles/switch-vision-profiles.yaml")
'''
          if old not in ctext:
              raise SystemExit('missing component-contract path anchor')
          ctext = ctext.replace(old, new, 1)
          old = '''    discovery_registry = json.loads(discovery_registry_path.read_text(encoding="utf-8"))
    core_registry = json.loads(fetch_text(args.core_registry_url))
'''
          new = '''    discovery_registry = json.loads(discovery_registry_path.read_text(encoding="utf-8"))
    profile_payload = yaml.safe_load(discovery_profiles_path.read_text(encoding="utf-8")) or {}
    discovery_profiles = profile_payload.get("profiles") or {}
    if not isinstance(discovery_profiles, dict):
        errors.append("Discovery profile file does not contain a profiles mapping")
        discovery_profiles = {}
    for item in discovery_registry.get("devices", []):
        if not isinstance(item, dict):
            continue
        model = str(item.get("model") or "").strip() or "<unknown>"
        mapping_profile = str(item.get("mapping_profile") or "").strip()
        if mapping_profile and mapping_profile not in discovery_profiles:
            errors.append(f"{model}: mapping_profile {mapping_profile!r} is not defined in shipped profiles")
    core_registry = json.loads(fetch_text(args.core_registry_url))
'''
          if old not in ctext:
              raise SystemExit('missing component-contract registry anchor')
          ctext = ctext.replace(old, new, 1)
          ccp.write_text(ctext, encoding='utf-8')

          # Real synthetic walk regression: proves the same paths used by Discovery
          # report 52 physical / 48 RJ45 / 4 SFP and generate 1G SFP entities.
          (ROOT / 'tools/test_c3750_48p_live_mapping.py').write_text(r'''from __future__ import annotations

import json
import os
from pathlib import Path
import subprocess
import tempfile

ROOT = Path(__file__).resolve().parents[1]

with tempfile.TemporaryDirectory(prefix="sv-c3750-") as td:
    work = Path(td)
    walk = work / "c3750.txt"
    report = work / "report.txt"
    generated = work / "generated.yaml"
    card = work / "card.yaml"
    targets = work / "targets.csv"
    last_run = work / "last-run.txt"
    caps = work / "capabilities"
    options = work / "options.json"

    lines = [
        '.1.3.6.1.2.1.1.1.0 = STRING: "Cisco IOS Software, WS-C3750-48P"',
        '.1.3.6.1.2.1.1.5.0 = STRING: "c3750-test"',
    ]
    idx = 1
    for port in range(1, 49):
        lines.append(f'.1.3.6.1.2.1.31.1.1.1.1.{idx} = STRING: "Fa1/0/{port}"')
        lines.append(f'.1.3.6.1.2.1.2.2.1.8.{idx} = INTEGER: up(1)')
        lines.append(f'.1.3.6.1.2.1.31.1.1.1.15.{idx} = Gauge32: 100')
        idx += 1
    for port in range(1, 5):
        lines.append(f'.1.3.6.1.2.1.31.1.1.1.1.{idx} = STRING: "Gi1/0/{port}"')
        lines.append(f'.1.3.6.1.2.1.2.2.1.8.{idx} = INTEGER: up(1)')
        lines.append(f'.1.3.6.1.2.1.31.1.1.1.15.{idx} = Gauge32: 1000')
        idx += 1
    walk.write_text("\n".join(lines) + "\n", encoding="utf-8")
    targets.write_text(f"switch name,switch host,sensor prefix,switch snmp community,output_dir,display name\n{walk.name},192.0.2.10,C3750,public,{work},C3750\n", encoding="utf-8")
    options.write_text(json.dumps({
        "input_path": str(walk),
        "snmpwalks_dir": str(work),
        "report_path": str(report),
        "parse_all_walks": True,
        "generate_snmp2mqtt": True,
        "targets_csv": str(targets),
        "generated_yaml_path": str(generated),
        "generated_card_path": str(card),
        "last_run_summary_path": str(last_run),
        "run_snmp_walks": False,
        "enable_switch_list": False,
    }), encoding="utf-8")

    env = os.environ.copy()
    env.update({
        "SWITCH_VISION_OPTIONS_FILE": str(options),
        "CV_VENDOR_DIR": str(ROOT / "runtime_src/opt/switch-vision/vendors"),
        "CV_MIB_DATABASE_DIR": str(ROOT / "runtime_src/opt/switch-vision/mib_database"),
        "SWITCH_VISION_CAPABILITIES_DIR": str(caps),
    })
    result = subprocess.run(
        ["sh", str(ROOT / "runtime_src/discovery_job.sh")],
        cwd=ROOT,
        env=env,
        text=True,
        stdout=subprocess.PIPE,
        stderr=subprocess.STDOUT,
        timeout=60,
    )
    assert result.returncode == 0, result.stdout
    report_text = report.read_text(encoding="utf-8")
    assert "Model/platform: WS-C3750-48P" in report_text, report_text
    assert "- Physical switch interfaces detected: 52" in report_text, report_text
    assert "- RJ45 FastEthernet <member>/0/1-48 ports: 48" in report_text, report_text
    assert "- 1G SFP GigabitEthernet <member>/0/1-4 uplinks: 4" in report_text, report_text
    assert "- Matched profile: cisco-3750-48p-48fe-4sfp" in report_text, report_text

    cap_files = list(caps.glob("*-capabilities.json"))
    assert cap_files, "normalized capabilities JSON was not generated"
    cap = json.loads(cap_files[0].read_text(encoding="utf-8"))
    summary = cap["summary"]
    assert summary["physical_count"] == 52, summary
    assert summary["rj45_count"] == 48, summary
    assert summary["sfp_count"] == 4, summary
    assert summary["sfp_plus_count"] == 0, summary
    assert summary["uplink_count"] == 4, summary

    yaml_text = generated.read_text(encoding="utf-8")
    assert "C3750 Port 48 Status" in yaml_text, yaml_text
    assert "C3750 SFP 1G 4 Status" in yaml_text, yaml_text
    assert "C3750 Port 49 Status" not in yaml_text, yaml_text
    assert "C3750 SFP 10G" not in yaml_text, yaml_text
    assert "[value | int, 100] | min" in yaml_text, "FastEthernet speed cap missing"
    assert "[value | int, 1000] | min" in yaml_text, "1G SFP speed cap missing"

print("Switch Vision Discovery Catalyst 3750 live mapping: PASS")
''', encoding='utf-8')

          # Strengthen the existing exact-model contract as well.
          tpath = ROOT / 'tools/test_c3750_48p_contract.py'
          ttext = tpath.read_text(encoding='utf-8')
          if 'assert device["default_faceplate"]' not in ttext:
              ttext = ttext.replace(
                  'assert device["mapping_profile"] == "cisco-3750-48p-48fe-4sfp"\n',
                  'assert device["mapping_profile"] == "cisco-3750-48p-48fe-4sfp"\nassert device["default_faceplate"] == "faceplates/48rj45-4sfp.png"\nassert device["calibration_profile"] == "default_cisco_48_port"\n',
                  1,
              )
          tpath.write_text(ttext, encoding='utf-8')

          # Run live regression in component-contract CI.
          wf = ROOT / '.github/workflows/check-component-contracts.yml'
          wtext = wf.read_text(encoding='utf-8')
          anchor = '''      - name: Check Catalyst 3750 exact-model contract
        run: python3 tools/test_c3750_48p_contract.py
'''
          addition = anchor + '''      - name: Check Catalyst 3750 live 48+4 mapping
        run: python3 tools/test_c3750_48p_live_mapping.py
'''
          if anchor not in wtext:
              raise SystemExit('missing 3750 workflow anchor')
          wtext = wtext.replace(anchor, addition, 1)
          wf.write_text(wtext, encoding='utf-8')

          # Release notes.
          changelog = ROOT / 'switch_vision_discovery/CHANGELOG.md'
          ch = changelog.read_text(encoding='utf-8')
          entry = '''## 2.1.42

- Correct live Cisco `WS-C3750-48P` interface classification to the stock 48-RJ45 + 4-SFP layout: 48 × 10/100 FastEthernet access ports plus four physical 1G SFP uplinks.
- Prevent `Gi<member>/0/1-4` on this exact model from falling through the generic Catalyst RJ45 classifier.
- Generate the four uplinks as 1G SFP entities, cap FastEthernet capability at 100 Mbps and SFP capability at 1000 Mbps, and keep SFP+ disabled for this model.
- Add a synthetic end-to-end 3750 walk regression proving 52 physical interfaces, 48 RJ45, four 1G SFP uplinks, correct generated YAML labels, and the stock `48rj45-4sfp.png` visual contract.
- Add generic registry-to-profile referential-integrity validation so any exact device that names a missing mapping profile fails CI.

'''
          if not ch.startswith('# Changelog\n\n'):
              raise SystemExit('unexpected changelog header')
          ch = '# Changelog\n\n' + entry + ch[len('# Changelog\n\n'):]
          changelog.write_text(ch, encoding='utf-8')

          (ROOT / 'switch_vision_discovery/release-fragments/2.1.42.md').write_text('''# Discovery 2.1.42

- Fix Cisco WS-C3750-48P live classification to 48 FastEthernet RJ45 + 4 x 1G SFP on the stock 48+4 faceplate.
- Keep FastEthernet capped at 100 Mbps and the four SFP cages capped at 1G; no SFP+ is advertised.
- Add end-to-end synthetic-walk and registry/profile integrity regressions so the 48+4 mapping is exercised by CI rather than only declared in metadata.
- Public release text remains anonymous and contains no private contribution identifiers.
''', encoding='utf-8')
          PY

          python3 -m py_compile tools/check_component_contracts.py tools/test_c3750_48p_contract.py tools/test_c3750_48p_live_mapping.py
          python3 tools/test_c3750_48p_contract.py
          python3 tools/test_c3750_48p_live_mapping.py
          git status --short
      - name: Commit review branch
