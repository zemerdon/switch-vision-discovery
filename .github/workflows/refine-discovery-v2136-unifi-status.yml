name: Refine Discovery v2.1.36 UniFi-only diagnostics

on:
  push:
    branches:
      - fix/unifi-only-snmp-status-v2136-final

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML websockets
      - name: Gate stale SNMP YAML diagnostics by applicability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('runtime_src/support_web.py')
          text = path.read_text(encoding='utf-8')
          old_line = '        for label, path in [("SNMP2MQTT YAML", share / "generated-snmp2mqtt.yaml"), ("dashboard YAML", share / "generated-dashboard-card.yaml")]:\n'
          new_lines = (
              '        stale_candidates = [("dashboard YAML", share / "generated-dashboard-card.yaml")]\n'
              '        if snmp2mqtt_applicability["applicable"]:\n'
              '            stale_candidates.insert(0, ("SNMP2MQTT YAML", share / "generated-snmp2mqtt.yaml"))\n'
              '        for label, path in stale_candidates:\n'
          )
          if old_line not in text:
              raise SystemExit('Could not locate generated-file stale diagnostic loop')
          path.write_text(text.replace(old_line, new_lines, 1), encoding='utf-8', newline='\n')

          test_path = Path('runtime_src/self-test.sh')
          tests = test_path.read_text(encoding='utf-8')
          anchor = 'assert \'"snmp2mqtt_applicability": snmp2mqtt_applicability\' in source\n'
          addition = (
              anchor
              + 'assert \'if snmp2mqtt_applicability["applicable"]:\' in source\n'
              + 'assert \'stale_candidates.insert(0, ("SNMP2MQTT YAML"\' in source\n'
          )
          if anchor not in tests:
              raise SystemExit('Could not locate v2.1.36 regression assertion anchor')
          test_path.write_text(tests.replace(anchor, addition, 1), encoding='utf-8', newline='\n')
          PY

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C runtime_src . | gzip -n > switch_vision_discovery/runtime.tar.gz
          rm -f .github/workflows/refine-discovery-v2136-unifi-status.yml

      - name: Validate refined Discovery 2.1.36
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_runtime_parity.py
          sh runtime_src/self-test.sh
          python -m py_compile runtime_src/support_web.py
          git diff --check

      - name: Commit refined source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Gate Discovery SNMP diagnostics by active data path'
          git push origin HEAD:fix/unifi-only-snmp-status-v2136-final
