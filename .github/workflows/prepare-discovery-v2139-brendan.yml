name: Prepare Discovery v2.1.39 Brendan UniFi review

on:
  push:
    branches:
      - review/sv-2026-000034-000036-brendan-unifi

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML websockets

      - name: Add Brendan exact-model contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap
          import yaml

          registry_path = Path('runtime_src/opt/switch-vision/devices/supported_devices.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          existing = {str(d.get('model')) for d in registry.get('devices', []) if isinstance(d, dict)}
          wanted = {'UCG Ultra', 'US 16 PoE 150W', 'USW Pro Max 24', 'USW Ultra'}
          overlap = existing & wanted
          if overlap:
              raise SystemExit('Brendan models already exist: ' + ', '.join(sorted(overlap)))

          def contributions():
              return [
                  {
                      'id': 'SV-2026-000034',
                      'source_component': 'UniFi2MQTT 2.0.47',
                      'source_discovery_version': '2.1.37',
                      'devices_observed': 1,
                      'validation_scope': 'physical_api_contract_repeat_capture',
                      'api_capabilities': {'port_detail': True, 'per_port_traffic': False},
                      'dashboard_validation': 'generic_card_generated',
                      'contributor': {'display_name': 'Anonymous', 'public_credit': False},
                  },
                  {
                      'id': 'SV-2026-000036',
                      'source_component': 'UniFi2MQTT 2.0.47',
                      'source_discovery_version': '2.1.37',
                      'devices_observed': 1,
                      'validation_scope': 'physical_api_contract_repeat_capture',
                      'api_capabilities': {'port_detail': True, 'per_port_traffic': False},
                      'dashboard_validation': 'generic_card_generated',
                      'contributor': {'display_name': 'Brendan Pratt', 'public_credit': True},
                  },
              ]

          common = {
              'status': 'experimental',
              'confirmed_since': '2.4.10',
              'last_validated_version': '2.4.10',
              'evidence': 'support_my_switch_SV-2026-000034_and_SV-2026-000036_unifi_api',
              'stack_support': False,
              'discovery_support': True,
              'optional_faceplates': [],
              'tested_firmware': [],
              'contributor': {'display_name': 'Brendan Pratt', 'public_credit': True},
          }

          devices = []

          item = dict(common)
          item.update({
              'vendor': 'Ubiquiti', 'family': 'UniFi Cloud Gateway Ultra', 'model': 'UCG Ultra',
              'ports': {'rj45': 5, 'poe': False, 'uplinks': 0, 'uplink_type': 'none', 'gigabit_sfp': 0, 'ten_gigabit_sfp_plus': 0},
              'dashboard_support': False, 'mapping_profile': 'ubiquiti-ucg-ultra-api',
              'calibration_profile': '', 'default_faceplate': '', 'contributions': contributions(),
              'notes': [
                  'SV-2026-000034 and SV-2026-000036 are two corroborating captures of the same physical UCG Ultra and preserve the same five-port topology while normal live counters change.',
                  'Live UniFi API evidence exposes four 1G RJ45 ports plus one 2.5G-capable RJ45 port and no PoE output capability.',
                  'The device is a Cloud Gateway with integrated switching; Switch Vision accepts it because the UniFi controller advertises switching capability rather than because the model name resembles a switch.',
                  'WAN/LAN role is deliberately not inferred from physical port position; controller state remains authoritative for role semantics.',
                  'Port detail is available while per-port RX/TX traffic is unavailable through the contributed UniFi API path.',
                  'No verified five-port UCG Ultra faceplate exists yet, so exact dashboard visuals remain pending; Discovery uses its safe generic visual while retaining the real five-port count.',
              ],
              'validation': {'exact_model_detection': 'live_api_confirmed_two_corroborating_captures', 'rj45_mapping': 'live_api_confirmed_five_physical_ports', 'poe': 'live_api_confirmed_no_poe_output_capability', 'system_sensors': 'live_api_confirmed_cpu_memory_uptime', 'uplinks': 'not_applicable', 'stack': 'not_applicable'},
              'visuals': {'status': 'detected', 'recommended_faceplate': '', 'optional_faceplates': [], 'calibration_profile': '', 'canvas': {'width': 2048, 'height': 448}},
          })
          devices.append(item)

          item = dict(common)
          item.update({
              'vendor': 'Ubiquiti', 'family': 'UniFi Switch 16 PoE 150W', 'model': 'US 16 PoE 150W',
              'ports': {'rj45': 16, 'poe': True, 'uplinks': 2, 'uplink_type': '2x 1G SFP', 'gigabit_sfp': 2, 'ten_gigabit_sfp_plus': 0},
              'dashboard_support': False, 'mapping_profile': 'ubiquiti-us-16-poe-150w-api',
              'calibration_profile': '', 'default_faceplate': '', 'contributions': contributions(),
              'notes': [
                  'SV-2026-000034 and SV-2026-000036 independently repeat the same 16x 1G RJ45 plus 2x 1G SFP topology on the contributed US 16 PoE 150W.',
                  'All sixteen copper ports expose PoE output capability in the normalized UniFi API evidence; the two SFP ports do not.',
                  'The contract records the standardized PoE metadata actually exposed by the API and does not invent legacy passive-24V state that was not present in the contribution.',
                  'Port detail is available while per-port RX/TX traffic is unavailable through the contributed UniFi API path.',
                  'A dedicated 16 RJ45 + 2 SFP faceplate is not yet verified, so exact dashboard visuals remain pending; Discovery uses its safe generic 24+2 visual with the true 16+2 counts.',
              ],
              'validation': {'exact_model_detection': 'live_api_confirmed_two_corroborating_captures', 'rj45_mapping': 'live_api_confirmed_ports_1_16', 'poe': 'live_api_confirmed_output_capability_ports_1_16', 'system_sensors': 'live_api_confirmed_cpu_memory_uptime', 'uplinks': 'live_api_confirmed_ports_17_18_1g_sfp', 'stack': 'not_applicable'},
              'visuals': {'status': 'detected', 'recommended_faceplate': '', 'optional_faceplates': [], 'calibration_profile': '', 'canvas': {'width': 2048, 'height': 448}},
          })
          devices.append(item)

          item = dict(common)
          item.update({
              'vendor': 'Ubiquiti', 'family': 'UniFi Switch Pro Max 24', 'model': 'USW Pro Max 24',
              'ports': {'rj45': 24, 'poe': False, 'uplinks': 2, 'uplink_type': '2x 10G SFP+', 'gigabit_sfp': 0, 'ten_gigabit_sfp_plus': 2},
              'dashboard_support': True, 'mapping_profile': 'ubiquiti-usw-pro-max-24-api',
              'calibration_profile': 'unifi_24p_rj45_2sfp', 'default_faceplate': 'faceplates/unifi-24p-rj45-2sfp.png', 'contributions': contributions(),
              'notes': [
                  'SV-2026-000034 and SV-2026-000036 repeat the same physical/API topology for the non-PoE USW Pro Max 24.',
                  'Ports 1-16 are 1G RJ45, ports 17-24 are 2.5G-capable RJ45, and ports 25-26 are 10G SFP+.',
                  'Maximum connector capability remains separate from current negotiated speed so a 2.5G-capable copper port may truthfully display a lower live link speed.',
                  'No PoE output capability is reported for this non-PoE model.',
                  'Port detail is available while per-port RX/TX traffic is unavailable through the contributed UniFi API path.',
                  'The existing UniFi 24 RJ45 + 2 SFP generic faceplate has exact physical socket geometry for this model and is therefore safe as its current exact layout visual; model-specific artwork may replace it later without changing the API mapping contract.',
              ],
              'validation': {'exact_model_detection': 'live_api_confirmed_two_corroborating_captures', 'rj45_mapping': 'live_api_confirmed_ports_1_24_with_ports_17_24_2p5g_capable', 'poe': 'live_api_confirmed_no_poe_output_capability', 'system_sensors': 'live_api_confirmed_cpu_memory_uptime', 'uplinks': 'live_api_confirmed_ports_25_26_10g_sfp_plus', 'stack': 'not_applicable'},
              'visuals': {'status': 'experimental', 'recommended_faceplate': 'faceplates/unifi-24p-rj45-2sfp.png', 'optional_faceplates': [], 'calibration_profile': 'unifi_24p_rj45_2sfp', 'canvas': {'width': 2048, 'height': 448}},
          })
          devices.append(item)

          item = dict(common)
          item.update({
              'vendor': 'Ubiquiti', 'family': 'UniFi Switch Ultra', 'model': 'USW Ultra',
              'ports': {'rj45': 8, 'poe': True, 'uplinks': 0, 'uplink_type': 'none', 'gigabit_sfp': 0, 'ten_gigabit_sfp_plus': 0},
              'dashboard_support': False, 'mapping_profile': 'ubiquiti-usw-ultra-api',
              'calibration_profile': '', 'default_faceplate': '', 'contributions': contributions(),
              'notes': [
                  'SV-2026-000034 and SV-2026-000036 repeat the same eight-port 1G RJ45 topology for USW Ultra.',
                  'PoE output capability is exposed on ports 1-7 only; port 8 is not advertised as a PoE output port, preserving the hardware distinction between PoE output and the PoE input/uplink port.',
                  'Port detail is available while per-port RX/TX traffic is unavailable through the contributed UniFi API path.',
                  'No verified eight-port USW Ultra faceplate exists yet, so exact dashboard visuals remain pending; Discovery uses its safe generic visual while preserving the real eight-port count.',
              ],
              'validation': {'exact_model_detection': 'live_api_confirmed_two_corroborating_captures', 'rj45_mapping': 'live_api_confirmed_ports_1_8', 'poe': 'live_api_confirmed_output_capability_ports_1_7_only', 'system_sensors': 'live_api_confirmed_cpu_memory_uptime', 'uplinks': 'not_applicable', 'stack': 'not_applicable'},
              'visuals': {'status': 'detected', 'recommended_faceplate': '', 'optional_faceplates': [], 'calibration_profile': '', 'canvas': {'width': 2048, 'height': 448}},
          })
          devices.append(item)

          registry['devices'].extend(devices)
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8', newline='\n')

          profiles = {
              'ubiquiti-ucg-ultra-api': {
                  'status': 'experimental', 'vendor': 'Ubiquiti', 'family': 'UniFi Cloud Gateway Ultra',
                  'model_patterns': ['UCG Ultra'],
                  'layout': {'members': 1, 'rj45_ports': 5, 'sfp_1g_ports': 0, 'sfp_10g_ports': 0},
                  'interface_patterns': {'rj45': ['api-port-{port}'], 'sfp_1g': [], 'sfp_10g': []},
                  'notes': [
                      'SV-2026-000034 and SV-2026-000036 confirm five sequential API/physical RJ45 ports.',
                      'Four ports are 1G-capable and one is 2.5G-capable; WAN/LAN role remains controller-driven rather than position-derived.',
                      'Dedicated UCG Ultra dashboard artwork remains pending.',
                  ],
              },
              'ubiquiti-us-16-poe-150w-api': {
                  'status': 'experimental', 'vendor': 'Ubiquiti', 'family': 'UniFi Switch 16 PoE 150W',
                  'model_patterns': ['US 16 PoE 150W'],
                  'layout': {'members': 1, 'rj45_ports': 16, 'sfp_1g_ports': 2, 'sfp_10g_ports': 0},
                  'interface_patterns': {'rj45': ['api-port-{port}'], 'sfp_1g': ['api-port-17', 'api-port-18'], 'sfp_10g': []},
                  'notes': [
                      'SV-2026-000034 and SV-2026-000036 confirm 16 sequential 1G RJ45 ports followed by two 1G SFP ports.',
                      'PoE output capability is exposed on all sixteen copper ports in the contributed UniFi API data.',
                      'Dedicated 16+2 dashboard artwork remains pending.',
                  ],
              },
              'ubiquiti-usw-pro-max-24-api': {
                  'status': 'experimental', 'vendor': 'Ubiquiti', 'family': 'UniFi Switch Pro Max 24',
                  'model_patterns': ['USW Pro Max 24'],
                  'layout': {'members': 1, 'rj45_ports': 24, 'sfp_1g_ports': 0, 'sfp_10g_ports': 2},
                  'interface_patterns': {'rj45': ['api-port-{port}'], 'sfp_1g': [], 'sfp_10g': ['api-port-25', 'api-port-26']},
                  'notes': [
                      'SV-2026-000034 and SV-2026-000036 confirm ports 1-16 as 1G RJ45, ports 17-24 as 2.5G-capable RJ45, and ports 25-26 as 10G SFP+.',
                      'This is the non-PoE USW Pro Max 24 variant.',
                      'The existing UniFi 24+2 faceplate has truthful physical socket geometry for this exact model.',
                  ],
              },
              'ubiquiti-usw-ultra-api': {
                  'status': 'experimental', 'vendor': 'Ubiquiti', 'family': 'UniFi Switch Ultra',
                  'model_patterns': ['USW Ultra'],
                  'layout': {'members': 1, 'rj45_ports': 8, 'sfp_1g_ports': 0, 'sfp_10g_ports': 0},
                  'interface_patterns': {'rj45': ['api-port-{port}'], 'sfp_1g': [], 'sfp_10g': []},
                  'notes': [
                      'SV-2026-000034 and SV-2026-000036 confirm eight sequential 1G RJ45 ports.',
                      'PoE output capability is exposed on ports 1-7 only; port 8 is not a PoE output.',
                      'Dedicated USW Ultra dashboard artwork remains pending.',
                  ],
              },
          }
          profiles_path = Path('runtime_src/profiles/switch-vision-profiles.yaml')
          profile_doc = yaml.safe_load(profiles_path.read_text(encoding='utf-8')) or {}
          profile_map = profile_doc.get('profiles', profile_doc)
          duplicate_profiles = set(profile_map) & set(profiles)
          if duplicate_profiles:
              raise SystemExit('Brendan profiles already exist: ' + ', '.join(sorted(duplicate_profiles)))
          block = yaml.safe_dump({'profiles': profiles}, sort_keys=False, allow_unicode=True).split('\n', 1)[1]
          profiles_path.write_text(profiles_path.read_text(encoding='utf-8').rstrip() + '\n' + block, encoding='utf-8', newline='\n')

          test_path = Path('tools/test_unifi_dashboard_failure_modes.py')
          test_text = test_path.read_text(encoding='utf-8')
          start = test_text.index('        # Brendan regression:')
          end = test_text.index('        # Registered devices waiting for exact visuals', start)
          replacement = r'''        # Brendan regression: the four contributed exact hardware contracts must
          # all render. Pro Max 24 has truthful exact 24+2 visual geometry; the
          # three compact/legacy models retain safe generic cards until dedicated
          # artwork exists.
          write_json(
              registry,
              {
                  "devices": [
                      {"vendor": "Ubiquiti", "model": "UCG Ultra", "status": "experimental", "dashboard_support": False},
                      {"vendor": "Ubiquiti", "model": "US 16 PoE 150W", "status": "experimental", "dashboard_support": False},
                      {"vendor": "Ubiquiti", "model": "USW Pro Max 24", "status": "experimental", "dashboard_support": True, "calibration_profile": "unifi_24p_rj45_2sfp", "default_faceplate": "faceplates/unifi-24p-rj45-2sfp.png"},
                      {"vendor": "Ubiquiti", "model": "USW Ultra", "status": "experimental", "dashboard_support": False},
                  ]
              },
          )
          write_json(
              snapshot,
              {
                  "schema_version": 1,
                  "devices": [
                      device("brendan-ucg", "UCG Ultra", 5),
                      device("brendan-us16", "US 16 PoE 150W", 16, 2),
                      device("brendan-promax24", "USW Pro Max 24", 24, 2),
                      device("brendan-ultra", "USW Ultra", 8),
                  ],
              },
          )
          brendan = run(snapshot, registry)
          assert brendan.returncode == 0, brendan
          assert brendan.stdout.count("type: custom:switch-vision-3650") == 4
          for model in ("UCG Ultra", "US 16 PoE 150W", "USW Pro Max 24", "USW Ultra"):
              assert f"switch_model: {model}" in brendan.stdout
          assert brendan.stdout.count("calibration_profile: unifi_24p_rj45_2sfp") == 4
          assert brendan.stdout.count("faceplate_file: unifi-24p-rj45-2sfp.png") == 4
          assert brendan.stdout.count("generic_faceplate: true") == 3
          assert brendan.stdout.count("generic_faceplate: false") == 1
          assert (
              "UniFi cards emitted: 4; exact cards: 1; generic fallbacks: 3; "
              "exact support pending: 3; issues: 0"
          ) in brendan.stdout

          '''
          test_path.write_text(test_text[:start] + textwrap.dedent(replacement) + test_text[end:], encoding='utf-8', newline='\n')

          self_test = Path('runtime_src/self-test.sh')
          self_text = self_test.read_text(encoding='utf-8')
          marker = '# SV-2026-000034/000036 Brendan UniFi exact-model contract regression.'
          if marker in self_text:
              raise SystemExit('Brendan packaged regression already present')
          block = r'''

          # SV-2026-000034/000036 Brendan UniFi exact-model contract regression.
          python3 - "$RUNTIME_REGISTRY" "$BASE_DIR/profiles/switch-vision-profiles.yaml" <<'PYTEST_BRENDAN_UNIFI'
          import json
          import sys
          from pathlib import Path
          import yaml

          registry = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          profiles_doc = yaml.safe_load(Path(sys.argv[2]).read_text(encoding="utf-8")) or {}
          profiles = profiles_doc.get("profiles", profiles_doc)
          models = {d["model"]: d for d in registry["devices"] if isinstance(d, dict)}

          expected = {
              "UCG Ultra": (5, 0, False, False, "ubiquiti-ucg-ultra-api"),
              "US 16 PoE 150W": (16, 2, True, False, "ubiquiti-us-16-poe-150w-api"),
              "USW Pro Max 24": (24, 2, False, True, "ubiquiti-usw-pro-max-24-api"),
              "USW Ultra": (8, 0, True, False, "ubiquiti-usw-ultra-api"),
          }
          for model, (rj45, uplinks, poe, dashboard, profile) in expected.items():
              item = models[model]
              assert item["status"] == "experimental", model
              assert item["ports"]["rj45"] == rj45, model
              assert item["ports"]["uplinks"] == uplinks, model
              assert item["ports"]["poe"] is poe, model
              assert item["dashboard_support"] is dashboard, model
              assert item["mapping_profile"] == profile, model
              assert [c["id"] for c in item["contributions"]] == ["SV-2026-000034", "SV-2026-000036"], model
              assert item["contributions"][0]["contributor"]["public_credit"] is False, model
              assert item["contributions"][1]["contributor"]["display_name"] == "Brendan Pratt", model
              assert all(c["api_capabilities"]["per_port_traffic"] is False for c in item["contributions"]), model
              assert profile in profiles, profile

          promax = models["USW Pro Max 24"]
          assert promax["calibration_profile"] == "unifi_24p_rj45_2sfp"
          assert promax["default_faceplate"] == "faceplates/unifi-24p-rj45-2sfp.png"
          assert profiles["ubiquiti-usw-pro-max-24-api"]["interface_patterns"]["sfp_10g"] == ["api-port-25", "api-port-26"]
          assert profiles["ubiquiti-us-16-poe-150w-api"]["interface_patterns"]["sfp_1g"] == ["api-port-17", "api-port-18"]
          assert "ports_1_7_only" in models["USW Ultra"]["validation"]["poe"]
          assert "2p5g_capable" in promax["validation"]["rj45_mapping"]
          print("Switch Vision Discovery Brendan registry/profile contract: PASS")
          PYTEST_BRENDAN_UNIFI

          python3 - "$tmp_dir/brendan-unifi.json" <<'PYTEST_BRENDAN_SNAPSHOT'
          import json
          import sys
          from pathlib import Path

          def ports(rj45, sfp=0):
              rows = [{"idx": n, "connector": "RJ45", "max_speed_mbps": 1000} for n in range(1, rj45 + 1)]
              rows += [{"idx": rj45 + n, "connector": "SFPPLUS", "max_speed_mbps": 10000} for n in range(1, sfp + 1)]
              return rows

          snapshot = {"devices": [
              {"id": "brendan-ucg", "name": "UCG Ultra", "model": "UCG Ultra", "api_capabilities": {"port_detail": True, "per_port_traffic": False}, "ports": ports(5)},
              {"id": "brendan-us16", "name": "US 16 PoE 150W", "model": "US 16 PoE 150W", "api_capabilities": {"port_detail": True, "per_port_traffic": False}, "ports": ports(16, 2)},
              {"id": "brendan-promax24", "name": "USW Pro Max 24", "model": "USW Pro Max 24", "api_capabilities": {"port_detail": True, "per_port_traffic": False}, "ports": ports(24, 2)},
              {"id": "brendan-ultra", "name": "USW Ultra", "model": "USW Ultra", "api_capabilities": {"port_detail": True, "per_port_traffic": False}, "ports": ports(8)},
          ]}
          Path(sys.argv[1]).write_text(json.dumps(snapshot), encoding="utf-8")
          PYTEST_BRENDAN_SNAPSHOT

          python3 "$BASE_DIR/unifi_dashboard_cards.py" \
              --snapshot "$tmp_dir/brendan-unifi.json" \
              --registry "$RUNTIME_REGISTRY" \
              --summary > "$tmp_dir/brendan-unifi-cards.yaml"
          grep -q 'switch_model: UCG Ultra' "$tmp_dir/brendan-unifi-cards.yaml"
          grep -q 'switch_model: US 16 PoE 150W' "$tmp_dir/brendan-unifi-cards.yaml"
          grep -q 'switch_model: USW Pro Max 24' "$tmp_dir/brendan-unifi-cards.yaml"
          grep -q 'switch_model: USW Ultra' "$tmp_dir/brendan-unifi-cards.yaml"
          test "$(grep -c 'generic_faceplate: true' "$tmp_dir/brendan-unifi-cards.yaml")" -eq 3
          test "$(grep -c 'generic_faceplate: false' "$tmp_dir/brendan-unifi-cards.yaml")" -eq 1
          grep -q 'UniFi cards emitted: 4; exact cards: 1; generic fallbacks: 3; exact support pending: 3; issues: 0' "$tmp_dir/brendan-unifi-cards.yaml"
          echo "Switch Vision Discovery SV-2026-000034/000036 generated-card regression: PASS"
          '''
          self_test.write_text(self_text.rstrip() + textwrap.dedent(block), encoding='utf-8', newline='\n')

          config = Path('switch_vision_discovery/config.yaml')
          config_text = config.read_text(encoding='utf-8')
          if 'version: "2.1.38"' not in config_text:
              raise SystemExit('Unexpected Discovery version')
          config.write_text(config_text.replace('version: "2.1.38"', 'version: "2.1.39"', 1), encoding='utf-8', newline='\n')

          fragment = Path('switch_vision_discovery/release-fragments/2.1.39.md')
          fragment.write_text(textwrap.dedent('''
          - Add exact UniFi API hardware contracts from Brendan Pratt's corroborating `SV-2026-000034` and `SV-2026-000036` contributions for `UCG Ultra`, `US 16 PoE 150W`, `USW Pro Max 24`, and `USW Ultra`.
          - Give `USW Pro Max 24` exact 24-RJ45 + 2-SFP+ dashboard geometry using the existing UniFi 24+2 faceplate while preserving its verified 16 × 1G / 8 × 2.5G-capable copper split and 2 × 10G SFP+ uplinks.
          - Keep UCG Ultra, US 16 PoE 150W and USW Ultra exact visuals pending but continue rendering them through the safe UniFi generic fallback with their true observed 5-port, 16+2 and 8-port counts.
          - Preserve verified PoE semantics: US 16 PoE 150W exposes output capability on all 16 copper ports, USW Ultra on ports 1–7 only, and UCG Ultra / non-PoE USW Pro Max 24 expose no PoE output.
          - Preserve the contributed API capability boundary (`port_detail: true`, `per_port_traffic: false`) and do not synthesize unsupported per-port traffic/activity data.
          - Preserve `SV-2026-000034` as anonymous contribution metadata while applying Brendan Pratt's later explicit full-name recognition preference from `SV-2026-000036`.
          - Add permanent registry/profile and generated-card regressions proving one exact visual plus three safe generic fallbacks across Brendan's four models.
          ''').lstrip(), encoding='utf-8', newline='\n')
          PY

          rm -f .github/workflows/prepare-discovery-v2139-brendan.yml

      - name: Materialize and validate Discovery 2.1.39
        shell: bash
        run: |
          set -euo pipefail
          sh tools/materialize_runtime.sh
          python tools/test_unifi_dashboard_failure_modes.py
          python tools/check_runtime_parity.py
          python tools/test_visual_contract_policy.py
          python tools/check_component_contracts.py
          python tools/check_speed_contracts.py
          python tools/check_hub_identity.py
          python tools/test_regenerate_yaml_contract.py
          sh -x runtime_src/self-test.sh
          python -m py_compile \
            runtime_src/support_web.py \
            runtime_src/registry_lookup.py \
            runtime_src/vendor_sensor_scan.py \
            runtime_src/unifi_dashboard_cards.py \
            tools/check_component_contracts.py \
            tools/test_visual_contract_policy.py \
            tools/test_unifi_dashboard_failure_modes.py
          find runtime_src tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          grep -Fq 'version: "2.1.39"' switch_vision_discovery/config.yaml
          git diff --check

      - name: Commit tested Discovery 2.1.39 review source
        shell: bash
        run: |
          set -euo pipefail
