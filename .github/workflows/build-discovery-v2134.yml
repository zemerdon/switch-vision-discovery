name: Build Discovery v2.1.34 strict visual contracts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml websockets

      - name: Prepare or verify Discovery v2.1.34
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/prepare_discovery_v2134.py ]; then
            python tools/prepare_discovery_v2134.py
            echo 'needs_generation=true' >> "$GITHUB_OUTPUT"
          else
            grep -Fq 'version: "2.1.34"' switch_vision_discovery/config.yaml
            grep -Fq '## 2.1.34' switch_vision_discovery/CHANGELOG.md
            grep -Fq 'SWITCH_VISION_DISCOVERY_VERSION="2.1.34"' runtime_src/discovery_job.sh
            grep -Fq 'SWITCH_VISION_DISCOVERY_VERSION="2.1.34"' runtime_src/run.sh
            test "$(grep -Fc 'SWITCH_VISION_DISCOVERY_VERSION="2.1.34"' runtime_src/self-test.sh)" -ge 2
            echo 'needs_generation=false' >> "$GITHUB_OUTPUT"
            echo 'Discovery v2.1.34 product source is already prepared.'
          fi

      - name: Rebuild packaged runtime
        if: steps.prepare.outputs.needs_generation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f switch_vision_discovery/runtime.tar.gz
          tar -C runtime_src -czf switch_vision_discovery/runtime.tar.gz .

      - name: Validate runtime source/archive parity before imports
        run: python tools/check_runtime_parity.py

      - name: Validate strict visual-contract policy
        run: python tools/test_visual_contract_policy.py

      - name: Validate cross-component contracts
        run: python tools/check_component_contracts.py

      - name: Validate speed contracts
        run: python tools/check_speed_contracts.py

      - name: Validate hub identity
        run: python tools/check_hub_identity.py

      - name: Validate generated YAML contract
        run: python tools/test_regenerate_yaml_contract.py

      - name: Validate runtime self-test
        shell: bash
        run: |
          set -euo pipefail
          sh -x runtime_src/self-test.sh

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            runtime_src/support_web.py \
            runtime_src/registry_lookup.py \
            runtime_src/vendor_sensor_scan.py \
            runtime_src/unifi_dashboard_cards.py \
            tools/check_component_contracts.py \
            tools/test_visual_contract_policy.py

      - name: Validate clean generated source
        shell: bash
        run: |
          set -euo pipefail
          find runtime_src tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit tested product source to feature branch
        if: steps.prepare.outputs.needs_generation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/build-discovery-v2134.yml
          rm -f tools/prepare_discovery_v2134.py
          git add -A
          git commit -m 'Release Switch Vision Discovery v2.1.34'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
