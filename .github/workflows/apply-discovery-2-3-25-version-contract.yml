name: Apply Discovery 2.3.25 version contract

on:
  push:
    branches:
      - audit/discovery-2.3.24-functional
    paths:
      - tools/apply_discovery_2_3_25_version_contract.py
      - .github/workflows/apply-discovery-2-3-25-version-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/discovery-2.3.24-functional
          fetch-depth: 0
          persist-credentials: true

      - name: Apply version contract
        run: python3 tools/apply_discovery_2_3_25_version_contract.py

      - name: Commit synchronized version surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "switch-vision-bot"
          git config user.email "switch-vision-bot@users.noreply.github.com"
          git add runtime_src/discovery_job.sh runtime_src/self-test.sh
          if git diff --cached --quiet; then
            echo "No version-contract changes required."
            exit 0
          fi
          git commit -m "Sync Discovery 2.3.25 runtime version contract"
          git push origin HEAD:audit/discovery-2.3.24-functional
