name: Production physical contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-physical-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run production physical-contract regression
        shell: bash
        run: |
          set -euo pipefail
          sh tools/test_production_physical_contract.sh
          sh tools/test_discovery_contract_entrypoint.sh
          python3 tools/test_unifi_physical_contract.py
