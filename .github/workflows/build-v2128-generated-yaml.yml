name: Build Discovery v2.1.28 generated YAML fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/discovery-2.1.28-generated-yaml-atomic' }}
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML websockets
      - name: Prepare Discovery 2.1.28
        run: python3 tools/prepare_v2128_generated_yaml.py
      - name: Validate runtime source and regressions
        shell: bash
        run: |
          set -euo pipefail
          sh -n runtime_src/run.sh
          sh -n runtime_src/discovery_job.sh
          sh -n runtime_src/self-test.sh
          python3 -m py_compile \
            runtime_src/support_web.py \
            runtime_src/generated_yaml_guard.py \
            runtime_src/registry_lookup.py \
            runtime_src/unifi_dashboard_cards.py
          PYTHONDONTWRITEBYTECODE=1 sh runtime_src/self-test.sh
          python3 tools/check_speed_contracts.py
          python3 tools/check_component_contracts.py
          git diff --check
      - name: Rebuild runtime archive
        shell: bash
        run: |
          set -euo pipefail
          find runtime_src -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f switch_vision_discovery/runtime.tar.gz
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C runtime_src -czf switch_vision_discovery/runtime.tar.gz .
          python3 tools/check_runtime_parity.py
      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'version: "2.1.28"' switch_vision_discovery/config.yaml
          grep -Fq 'SWITCH_VISION_DISCOVERY_VERSION="2.1.28"' runtime_src/run.sh
          grep -Fq 'SWITCH_VISION_DISCOVERY_VERSION="2.1.28"' runtime_src/discovery_job.sh
          grep -Fq 'candidate_path="${GENERATED_YAML_PATH}.candidate.$$"' runtime_src/discovery_job.sh
          grep -Fq 'generated YAML does not contain a non-empty targets list' runtime_src/generated_yaml_guard.py
          ! grep -Fq '} > "$GENERATED_YAML_PATH"' runtime_src/discovery_job.sh
      - name: Remove temporary build machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v2128-generated-yaml.yml tools/prepare_v2128_generated_yaml.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
      - name: Commit built Discovery 2.1.28 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Discovery v2.1.28: atomic generated YAML handoff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
