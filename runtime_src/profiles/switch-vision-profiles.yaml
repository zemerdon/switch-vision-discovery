  huawei-s5720-12tp-li-ac:
    status: experimental
    vendor: Huawei
    family: S5720
    model_patterns:
    - S5720-12TP-LI-AC
    - Unknown Huawei S5720-12TP-LI-AC
    sys_object_ids:
    - 1.3.6.1.4.1.2011.2.23.394
    layout:
      members: 1
      rj45_ports: 8
      sfp_1g_ports: 4
      sfp_10g_ports: 0
    interface_patterns:
      rj45:
      - GigabitEthernet0/0/{port}
      sfp_1g:
      - GigabitEthernet0/0/9
      - GigabitEthernet0/0/10
      - GigabitEthernet0/0/11
      - GigabitEthernet0/0/12
      sfp_10g: []
    notes:
    - Profile derived from Support My Switch contributions SV-2026-000006 and SV-2026-000014.
    - SV-2026-000014 confirms an ifDescr-only IF-MIB layout with GigabitEthernet0/0/1-12.
    - Ports 1-8 are mapped as RJ45 and ports 9-12 as 1G SFP positions for this exact
      model.
    - Dashboard uses the generic 48 RJ45 + 4 SFP fallback visual until a smaller generic
      faceplate is supplied.
  zyxel-xs1930-10:
    status: experimental
    vendor: Zyxel
    family: XS1930
    model_patterns:
    - XS1930-10
    - Unknown XS1930-10
    - Unknown Zyxel XS1930-10
    sys_object_ids:
    - 1.3.6.1.4.1.890.1.15
    layout:
      members: 1
      rj45_ports: 8
      sfp_1g_ports: 0
      sfp_10g_ports: 2
    interface_patterns:
      rj45:
      - swp0{port_zero_based}
      sfp_1g: []
      sfp_10g:
      - swp08
      - swp09
    notes:
    - Profile derived from Support My Switch contribution SV-2026-000004.
    - ifIndex 1-10 maps directly to swp00-swp09.
    - swp00-swp07 map to faceplate ports 1-8; swp08-swp09 map to SFP+ uplinks 1-2.
    - Q-BRIDGE PVID is generated only when the current walk contains the direct bridge-port join.
    - Trunk/access mode and transceiver DDMI remain intentionally unclassified in v2.1.7.

  ubiquiti-usw-flex-mini-api:
    status: experimental
    vendor: Ubiquiti
