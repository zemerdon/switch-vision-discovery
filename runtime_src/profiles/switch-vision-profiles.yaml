  juniper-ex3300-48p:
    status: supported
    vendor: Juniper
    family: EX3300
    model_patterns:
    - EX3300-48P
    - ex3300-48p
    sys_object_ids:
    - 1.3.6.1.4.1.2636.1.1.1.2.76
    layout:
      members: 1
      rj45_ports: 48
      sfp_1g_ports: 0
      sfp_10g_ports: 4
    interface_patterns:
      rj45:
      - ge-0/0/{port_zero_based}
      sfp_1g: []
      sfp_10g:
      - xe-0/1/{port_zero_based}
      - ge-0/1/{port_zero_based}
    notes:
    - ge-0/0/0 through ge-0/0/47 map directly to faceplate labels 0 through 47.
    - ge-0/1/N and xe-0/1/N are alternate names for the same four uplink cages and
      must be deduplicated.
    - Logical unit interfaces ending in .0, me0, and vlan are excluded from the front
      panel.
  cisco-3560cg-8pc-8p-2dual:
    status: experimental
    vendor: Cisco
    family: Catalyst 3560-C
    model_patterns:
    - WS-C3560CG-8PC-S
    sys_object_ids:
    - 1.3.6.1.4.1.9.1.1317
    layout:
      members: 1
      rj45_ports: 8
      sfp_1g_ports: 2
      sfp_10g_ports: 0
    interface_patterns:
      rj45:
      - Gi0/{port}
      - GigabitEthernet0/{port}
      sfp_1g:
      - Gi0/9
      - Gi0/10
      - GigabitEthernet0/9
      - GigabitEthernet0/10
      sfp_10g: []
    notes:
    - Gi0/1 through Gi0/8 are access-port positions.
    - Gi0/9 and Gi0/10 are mapped as dual-purpose uplinks.
    - Temporary 24 RJ45 / 2 SFP visual profile; only eight copper overlays are active.
