name: Run Discovery v2.1.39 Brendan prep

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'review/sv-2026-000034-000036-brendan-unifi'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: review/sv-2026-000034-000036-brendan-unifi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML websockets

      - name: Execute guarded prep payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRUNNER'
          from pathlib import Path
          import json
          import re

          workflow = Path('.github/workflows/prepare-discovery-v2139-brendan.yml')
          text = workflow.read_text(encoding='utf-8')
          match = re.search(r"^          python3 - <<'PY'\n(.*?)^          PY$", text, re.M | re.S)
          if not match:
              raise SystemExit('Discovery prep payload not found')
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          exec(compile(payload, str(workflow), 'exec'), {'__name__': '__main__'})

          pending = {'UCG Ultra', 'US 16 PoE 150W', 'USW Ultra'}
          registry_path = Path('runtime_src/opt/switch-vision/devices/supported_devices.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          for item in registry.get('devices', []):
              if isinstance(item, dict) and item.get('model') in pending:
                  item['status'] = 'detected'
                  if isinstance(item.get('visuals'), dict):
                      item['visuals']['status'] = 'detected'
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8', newline='\n')

          profiles_path = Path('runtime_src/profiles/switch-vision-profiles.yaml')
          profiles_text = profiles_path.read_text(encoding='utf-8')
          for profile in ('ubiquiti-ucg-ultra-api', 'ubiquiti-us-16-poe-150w-api', 'ubiquiti-usw-ultra-api'):
              needle = f'  {profile}:\n    status: experimental\n'
              replacement = f'  {profile}:\n    status: detected\n'
              if needle not in profiles_text:
                  raise SystemExit(f'Expected profile status block missing: {profile}')
              profiles_text = profiles_text.replace(needle, replacement, 1)
          profiles_path.write_text(profiles_text, encoding='utf-8', newline='\n')

          test_path = Path('tools/test_unifi_dashboard_failure_modes.py')
          test_text = test_path.read_text(encoding='utf-8')
          start = test_text.index('# Brendan regression:')
          end = test_text.index('        # Registered devices waiting for exact visuals', start)
          block = test_text[start:end]
          block = '\n'.join(('        ' + line if line else line) for line in block.splitlines()) + '\n'
          block = block.replace(
              '{"vendor": "Ubiquiti", "model": "UCG Ultra", "status": "experimental",',
              '{"vendor": "Ubiquiti", "model": "UCG Ultra", "status": "detected",',
          ).replace(
              '{"vendor": "Ubiquiti", "model": "US 16 PoE 150W", "status": "experimental",',
              '{"vendor": "Ubiquiti", "model": "US 16 PoE 150W", "status": "detected",',
          ).replace(
              '{"vendor": "Ubiquiti", "model": "USW Ultra", "status": "experimental",',
              '{"vendor": "Ubiquiti", "model": "USW Ultra", "status": "detected",',
          )
          test_path.write_text(test_text[:start] + block + test_text[end:], encoding='utf-8', newline='\n')

          self_path = Path('runtime_src/self-test.sh')
          self_text = self_path.read_text(encoding='utf-8')
          self_text = self_text.replace(
              '              assert item["status"] == "experimental", model\n',
              '              expected_status = "experimental" if model == "USW Pro Max 24" else "detected"\n'
              '              assert item["status"] == expected_status, model\n',
              1,
          )
          self_path.write_text(self_text, encoding='utf-8', newline='\n')
          PYRUNNER
          rm -f \
            .github/workflows/prepare-discovery-v2139-brendan.yml \
            .github/workflows/run-discovery-v2139-brendan-prep.yml

      - name: Materialize runtime
        run: sh tools/materialize_runtime.sh

      - name: UniFi dashboard regressions
        run: python tools/test_unifi_dashboard_failure_modes.py

      - name: Runtime parity
        run: python tools/check_runtime_parity.py

      - name: Visual contract policy
        run: python tools/test_visual_contract_policy.py

      - name: Cross-component contracts
        run: python tools/check_component_contracts.py

      - name: Speed contracts
        run: python tools/check_speed_contracts.py

      - name: Hub identity
        run: python tools/check_hub_identity.py

      - name: YAML regeneration contract
        run: python tools/test_regenerate_yaml_contract.py

      - name: Packaged self-test
        shell: bash
        run: |
          set -o pipefail
          if ! sh -x runtime_src/self-test.sh > /tmp/switch-vision-self-test.log 2>&1; then
            echo '---- packaged self-test failure tail ----'
            tail -n 160 /tmp/switch-vision-self-test.log
            exit 1
          fi
          tail -n 40 /tmp/switch-vision-self-test.log

      - name: Compile and clean
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            runtime_src/support_web.py \
            runtime_src/registry_lookup.py \
            runtime_src/vendor_sensor_scan.py \
            runtime_src/unifi_dashboard_cards.py \
            tools/check_component_contracts.py \
            tools/test_visual_contract_policy.py \
            tools/test_unifi_dashboard_failure_modes.py
          find runtime_src tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          grep -Fq 'version: "2.1.39"' switch_vision_discovery/config.yaml
          git diff --check

      - name: Commit tested Discovery review source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Discovery v2.1.39 Brendan UniFi contracts'
          git push origin HEAD:review/sv-2026-000034-000036-brendan-unifi
