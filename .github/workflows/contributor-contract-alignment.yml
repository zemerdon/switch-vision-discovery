name: Contributor contract alignment

on:
  push:
    branches:
      - contrib/discovery-2.3.24-batch
    paths:
      - tools/apply_contributor_contract_alignment.py
      - .github/workflows/contributor-contract-alignment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out contributor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: contrib/discovery-2.3.24-batch
          fetch-depth: 0
          persist-credentials: true
      - name: Align registry and shipped profiles
        run: python3 tools/apply_contributor_contract_alignment.py
      - name: Commit aligned contracts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No contract alignment required."
            exit 0
          fi
          git config user.name "switch-vision-bot"
          git config user.email "switch-vision-bot@users.noreply.github.com"
          git add runtime_src/opt/switch-vision/devices/supported_devices.json runtime_src/profiles/switch-vision-profiles.yaml
          git commit -m "Align contributor registry with shipped profiles"
          git push origin HEAD:contrib/discovery-2.3.24-batch
