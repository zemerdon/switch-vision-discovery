name: Prepare Discovery 2.4.19 UniFi activity refresh

on:
  push:
    branches:
      - fix/discovery-2.4.19-faceplate-matrix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/discovery-2.4.19-faceplate-matrix
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml websockets

      - name: Apply 10-second UniFi refresh contract
        run: python tools/patch_unifi_activity_refresh_2419.py

      - name: Materialize deterministic runtime archive
        run: sh tools/materialize_runtime.sh

      - name: Validate UniFi activity refresh contract
        run: python tools/test_unifi_activity_refresh_contract.py

      - name: Validate exact-model faceplate matrix
        run: python tools/test_faceplate_matrix_2419.py

      - name: Validate runtime parity
        run: python tools/check_runtime_parity.py

      - name: Validate component contracts against pending Core 2.7.9
        run: >-
          python tools/check_component_contracts.py
          --core-registry-url https://raw.githubusercontent.com/zemerdon/switch-vision-releases/fix/core-2.7.9-faceplate-matrix/src/devices/supported_devices.json
          --core-settings-url https://raw.githubusercontent.com/zemerdon/switch-vision-releases/fix/core-2.7.9-faceplate-matrix/src/custom_components/switch_vision/__init__.py

      - name: Run functional audit
        run: python tools/audit_functional_contracts.py

      - name: Commit prepared Discovery 2.4.19 tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "Switch Vision SV-Dev"
          git config user.email "switch-vision@users.noreply.github.com"
          git add \
            runtime_src/unifi_dashboard_cards.py \
            switch_vision_discovery/CHANGELOG.md \
            switch_vision_discovery/runtime.tar.gz \
            tools/sv_release_check.py
          git commit -m "Discovery 2.4.19: align UniFi activity refresh cadence"
          git push origin HEAD:fix/discovery-2.4.19-faceplate-matrix
