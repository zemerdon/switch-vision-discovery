name: Check Discovery component contracts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML websockets
      - name: Materialize runtime version contract
        run: sh tools/materialize_runtime.sh
      - name: Check strict visual contract policy
        run: python3 tools/test_visual_contract_policy.py
      - name: Check cross-component contracts
        run: python3 tools/check_component_contracts.py
      - name: Check interface speed contracts
        run: python3 tools/check_speed_contracts.py
      - name: Check Switch Vision Hub identity
        run: python3 tools/check_hub_identity.py
      - name: Check stored-walk YAML regeneration contract
        run: python3 tools/test_regenerate_yaml_contract.py
      - name: Check Support My Switch SMTP/MIME contract
        run: python3 tools/test_support_email_mime.py
      - name: Check Catalyst 3750 exact-model contract
        run: python3 tools/test_c3750_48p_contract.py
      - name: Check Catalyst 3750 live 48+4 mapping
        run: python3 tools/test_c3750_48p_live_mapping.py
