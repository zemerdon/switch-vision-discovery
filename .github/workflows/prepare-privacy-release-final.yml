name: Prepare Discovery privacy maintenance release final

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'privacy/discovery-maintenance-2140-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: privacy/discovery-maintenance-2140-final
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml websockets
      - name: Sanitize and prepare Discovery 2.1.40
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sanitize_public_attribution.py --version 2.1.40
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              Path('switch_vision_discovery/config.yaml'): ('version: "2.1.39"', 'version: "2.1.40"'),
              Path('runtime_src/run.sh'): ('SWITCH_VISION_DISCOVERY_VERSION="2.1.39"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.40"'),
              Path('runtime_src/discovery_job.sh'): ('SWITCH_VISION_DISCOVERY_VERSION="2.1.39"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.40"'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected version token missing in {path}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          self_test = Path('runtime_src/self-test.sh')
          text = self_test.read_text(encoding='utf-8')
          text = text.replace('SWITCH_VISION_DISCOVERY_VERSION="2.1.39"', 'SWITCH_VISION_DISCOVERY_VERSION="2.1.40"')
          text = text.replace('["SV-2026-000034", "SV-2026-000036"]', '["community-validation-1", "community-validation-2"]')
          text = text.replace('Brendan Pratt', 'community contributor')
          text = text.replace('Brendan', 'Community')
          text = text.replace('brendan', 'community')
          text = re.sub(r'(?i)SV-(20\d{2})-(\d+)', 'community-validation', text)
          text = re.sub(r'(?i)SV_(20\d{2})_(\d+)', 'community_validation', text)
          self_test.write_text(text, encoding='utf-8', newline='\n')
          PY
          sh tools/materialize_runtime.sh
      - name: Validate public attribution privacy
        run: python tools/test_public_attribution_privacy.py
      - name: Validate UniFi dashboard failure modes
        run: python tools/test_unifi_dashboard_failure_modes.py
      - name: Validate runtime archive parity
        run: python tools/check_runtime_parity.py
      - name: Validate visual contract policy
        run: python tools/test_visual_contract_policy.py
      - name: Validate component contracts
        run: python tools/check_component_contracts.py
      - name: Validate interface speed contracts
        run: python tools/check_speed_contracts.py
      - name: Validate Hub identity
        run: python tools/check_hub_identity.py
      - name: Validate regenerate-YAML contract
        run: python tools/test_regenerate_yaml_contract.py
      - name: Validate packaged Discovery self-test
        run: sh -x runtime_src/self-test.sh
      - name: Validate Python syntax and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile runtime_src/support_web.py runtime_src/registry_lookup.py runtime_src/vendor_sensor_scan.py runtime_src/unifi_dashboard_cards.py tools/sanitize_public_attribution.py tools/test_public_attribution_privacy.py tools/test_unifi_dashboard_failure_modes.py
          find runtime_src tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          grep -Fq 'version: "2.1.40"' switch_vision_discovery/config.yaml
          git diff --check
      - name: Restore normal builder and remove remediation scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git show d37f383554baa62c2fea58201e6165da29f9c105:.github/workflows/builder.yaml > .github/workflows/builder.yaml
          rm -f \
            .github/workflows/prepare-public-attribution-policy.yml \
            .github/workflows/prepare-privacy-release-final.yml \
            .privacy-remediation-trigger
      - name: Commit validated product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Discovery v2.1.40: enforce public attribution privacy policy'
          git push origin HEAD:privacy/discovery-maintenance-2140-final
