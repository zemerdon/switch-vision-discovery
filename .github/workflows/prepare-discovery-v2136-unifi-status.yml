name: Prepare Discovery v2.1.36 UniFi-only status fix

on:
  push:
    branches:
      - fix/unifi-only-snmp-status-v2136-final

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML websockets

      - name: Prepare Discovery 2.1.36 source and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          OLD = '2.1.35'
          NEW = '2.1.36'

          for path in [
              Path('switch_vision_discovery/config.yaml'),
              Path('runtime_src/run.sh'),
              Path('runtime_src/discovery_job.sh'),
              Path('runtime_src/self-test.sh'),
          ]:
              text = path.read_text(encoding='utf-8')
              if OLD not in text:
                  raise SystemExit(f'Expected {OLD} version marker missing from {path}')
              path.write_text(text.replace(OLD, NEW), encoding='utf-8', newline='\n')

          support = Path('runtime_src/support_web.py')
          text = support.read_text(encoding='utf-8')

          status_pattern = re.compile(
              r'def _generated_yaml_status\(\) -> dict\[str, Any\]:\n.*?(?=\n\ndef )',
              re.S,
          )
          match = status_pattern.search(text)
          if not match:
              raise SystemExit('Could not locate _generated_yaml_status()')

          replacement = dedent('''\
          def _snmp2mqtt_applicability() -> dict[str, Any]:
              """Return whether generated SNMP2MQTT YAML is relevant to this installation."""
              try:
                  options = _self_addon_options()
              except RuntimeError:
                  options = _load_options(DEFAULT_OPTIONS_FILE)

              generate_value = options.get("generate_snmp2mqtt", "true")
              if isinstance(generate_value, bool):
                  generator_enabled = generate_value
              else:
                  generator_enabled = str(generate_value).strip().lower() not in {
                      "false", "0", "no", "off", "disabled", "disable",
                  }
              if not generator_enabled:
                  return {
                      "applicable": False,
                      "reason": "SNMP2MQTT YAML generation is disabled in Discovery options.",
                  }

              rows = options.get("switches")
              if not isinstance(rows, list):
                  rows = options.get("multi_switch_walks")
              if isinstance(rows, list):
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      enabled_value = row.get("enabled", "enabled")
                      if isinstance(enabled_value, bool):
                          enabled = enabled_value
                      else:
                          state = str(enabled_value).strip().lower()
                          enabled = state not in {
                              "false", "disabled", "disable", "off", "no", "0",
                          }
                      if not enabled:
                          continue
                      switch_name = str(
                          row.get("switch_name")
                          or row.get("switch")
                          or row.get("selected_switch")
                          or row.get("name")
                          or ""
                      ).strip()
                      switch_host = str(
                          row.get("switch_host")
                          or row.get("host")
                          or row.get("manual_switch_host")
                          or ""
                      ).strip()
                      if switch_name and switch_host:
                          return {
                              "applicable": True,
                              "reason": "At least one enabled SNMP switch target is configured.",
                          }

              parse_value = options.get("parse_all_walks", "false")
              if isinstance(parse_value, bool):
                  parse_all = parse_value
              else:
                  parse_all = str(parse_value).strip().lower() in {
                      "true", "1", "yes", "on", "enabled", "enable",
                  }
              input_path = Path(
                  str(options.get("input_path") or (DEFAULT_SHARE_DIR / "snmpwalk.txt"))
              )
              if parse_all and input_path.is_file():
                  return {
                      "applicable": True,
                      "reason": "Legacy SNMP walk parsing is enabled with an available input walk.",
                  }

              return {
                  "applicable": False,
                  "reason": (
                      "No enabled SNMP targets are configured. "
                      "UniFi2MQTT-only installations do not require generated SNMP2MQTT YAML."
                  ),
              }


          def _generated_yaml_status() -> dict[str, Any]:
              applicability = _snmp2mqtt_applicability()
              generated = _file_info(DEFAULT_GENERATED_SNMP2MQTT)
              if not applicability["applicable"]:
                  return {
                      "applicable": False,
                      "reason": applicability["reason"],
                      "generated": generated,
                      "validation": {"valid": None, "error": None},
                      "import_note": (
                          "SNMP2MQTT YAML is not required while no enabled SNMP targets are configured. "
                          "UniFi API devices continue through UniFi2MQTT independently."
                      ),
                  }
              validation = _validate_snmp2mqtt_yaml(DEFAULT_GENERATED_SNMP2MQTT)
              return {
                  "applicable": True,
                  "reason": applicability["reason"],
                  "generated": generated,
                  "validation": {key: value for key, value in validation.items() if key != "text"},
                  "import_note": "A valid changed generated YAML is applied to Switch Vision SNMP2MQTT automatically when that app is available; invalid candidates are never published.",
              }
          ''')
          text = text[:match.start()] + replacement.rstrip() + text[match.end():]

          old_warning = '''    if not generated_yaml["found"]:\n        warnings.append("Generated SNMP2MQTT YAML was not found.")\n'''
          new_warning = '''    snmp2mqtt_applicability = _snmp2mqtt_applicability()\n    if not generated_yaml["found"] and snmp2mqtt_applicability["applicable"]:\n        warnings.append("Generated SNMP2MQTT YAML was not found.")\n'''
          if old_warning not in text:
              raise SystemExit('Could not locate diagnostics generated-YAML warning')
          text = text.replace(old_warning, new_warning, 1)

          old_files = '        "files": {"report": report, "generated_yaml": generated_yaml, "generated_card": generated_card},\n'
          new_files = old_files + '        "snmp2mqtt_applicability": snmp2mqtt_applicability,\n'
          if old_files not in text:
              raise SystemExit('Could not locate diagnostics files payload')
          text = text.replace(old_files, new_files, 1)

          old_diag_head = 'def _diagnostics_text(data: dict[str, Any]) -> str:\n    lines = [\n'
          new_diag_head = dedent('''\
          def _diagnostics_text(data: dict[str, Any]) -> str:
              snmp_applicability = data.get("snmp2mqtt_applicability") or {}
              if snmp_applicability.get("applicable", True):
                  snmp_yaml_status = (
                      "Found"
                      if ((data.get("files") or {}).get("generated_yaml") or {}).get("found")
                      else "Missing"
                  )
              else:
                  snmp_yaml_status = "Not applicable"
              lines = [
          ''')
          if old_diag_head not in text:
              raise SystemExit('Could not locate diagnostics text header')
          text = text.replace(old_diag_head, new_diag_head, 1)

          old_diag_line = '''        f"Generated SNMP2MQTT YAML: {'Found' if ((data.get('files') or {}).get('generated_yaml') or {}).get('found') else 'Missing'}",\n'''
          new_diag_line = '        f"Generated SNMP2MQTT YAML: {snmp_yaml_status}",\n'
          if old_diag_line not in text:
              raise SystemExit('Could not locate diagnostics SNMP2MQTT line')
          text = text.replace(old_diag_line, new_diag_line, 1)

          old_regen_help = '<p class="muted">Regenerate SNMP2MQTT YAML uses the existing saved Discovery data and SNMP walks. No new SNMP walks are performed.</p>'
          new_regen_help = '<p id="regenerateYamlHelp" class="muted">Regenerate SNMP2MQTT YAML uses the existing saved Discovery data and SNMP walks. No new SNMP walks are performed.</p>'
          if old_regen_help not in text:
              raise SystemExit('Could not locate regenerate YAML help text')
          text = text.replace(old_regen_help, new_regen_help, 1)

          old_description = '<p>Discovery writes the file used by the existing SNMP2MQTT generated-YAML import option. Keep that import option enabled. After a successful Discovery run, Switch Vision validates the YAML and automatically starts or restarts the SNMP2MQTT app.</p>'
          new_description = '<p id="generatedYamlDescription">SNMP2MQTT YAML is only required for switches using the SNMP data path. UniFi API devices use UniFi2MQTT and do not require this file.</p>'
          if old_description not in text:
              raise SystemExit('Could not locate generated YAML description')
          text = text.replace(old_description, new_description, 1)

          old_actions = '<div class="actions"><button id="previewGeneratedYamlButton" type="button">Preview generated YAML</button><a id="downloadGeneratedYamlButton" class="button" href="#">Download YAML</a></div>'
          new_actions = '<div id="generatedYamlActions" class="actions"><button id="previewGeneratedYamlButton" type="button">Preview generated YAML</button><a id="downloadGeneratedYamlButton" class="button" href="#">Download YAML</a></div>'
          if old_actions not in text:
              raise SystemExit('Could not locate generated YAML actions')
          text = text.replace(old_actions, new_actions, 1)

          js_start = text.find('async function loadGeneratedYamlStatus(){')
          js_end = text.find('\nasync function previewGeneratedYaml()', js_start)
          if js_start < 0 or js_end < 0:
              raise SystemExit('Could not locate loadGeneratedYamlStatus JavaScript')
          new_js = '''async function loadGeneratedYamlStatus(){try{const r=await fetch(endpoint('api/generated-yaml/status'),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not read generated YAML status');const applicable=d.applicable!==false;const found=!!d.generated?.found;const description=$('generatedYamlDescription');const actions=$('generatedYamlActions');const regen=$('regenerateYamlButton');const regenHelp=$('regenerateYamlHelp');const preview=$('generatedYamlPreview');const actionStatus=$('generatedYamlActionStatus');if(!applicable){$('generatedYamlState').textContent='Not in use';$('generatedYamlValidation').textContent=`Not applicable · ${d.reason||'No enabled SNMP targets are configured.'}`;$('generatedYamlUpdated').textContent='Not applicable';if(description)description.textContent='SNMP2MQTT YAML is only required for switches using the SNMP data path. UniFi API devices use UniFi2MQTT and do not require this file.';if(actions)actions.hidden=true;if(regen)regen.hidden=true;if(regenHelp)regenHelp.hidden=true;preview.textContent='';preview.classList.add('hidden');actionStatus.textContent='No SNMP2MQTT YAML action is required for this installation.';$('liveSnmp2mqtt').textContent='Not in use · no enabled SNMP targets';return}if(description)description.textContent='Discovery writes the file used by the SNMP2MQTT generated-YAML import option. After a successful SNMP Discovery run, Switch Vision validates the YAML and automatically starts or restarts the SNMP2MQTT app.';if(actions)actions.hidden=false;if(regen)regen.hidden=false;if(regenHelp)regenHelp.hidden=false;actionStatus.textContent='';$('generatedYamlState').textContent=found?`${d.generated.path||'generated-snmp2mqtt.yaml'} · ${d.generated.size||0} bytes`:'Not generated';$('generatedYamlValidation').textContent=d.validation?.valid?'Valid':`Invalid · ${d.validation?.error||'validation failed'}`;$('generatedYamlUpdated').textContent=d.generated?.modified||'Not available';$('downloadGeneratedYamlButton').href=endpoint('download/generated-snmp2mqtt.yaml')}catch(e){$('generatedYamlActionStatus').textContent=`Could not load generated YAML status: ${e}`}}'''
          text = text[:js_start] + new_js + text[js_end:]

          support.write_text(text, encoding='utf-8', newline='\n')

          self_test = Path('runtime_src/self-test.sh')
          tests = self_test.read_text(encoding='utf-8')
          regression = dedent('''\

          # v2.1.36 UniFi-only SNMP2MQTT status regression.
          PYTHONPATH="$BASE_DIR" python3 - <<'PYTEST_V2136_UNIFI_ONLY'
          import tempfile
          from pathlib import Path
          import support_web as web

          tmp = tempfile.TemporaryDirectory()
          web.DEFAULT_GENERATED_SNMP2MQTT = Path(tmp.name) / "generated-snmp2mqtt.yaml"

          web._self_addon_options = lambda: {
              "generate_snmp2mqtt": "true",
              "parse_all_walks": "false",
              "switches": [],
          }
          status = web._generated_yaml_status()
          assert status["applicable"] is False
          assert status["validation"]["valid"] is None
          assert "UniFi2MQTT-only" in status["reason"]

          source = Path(web.__file__).read_text(encoding="utf-8")
          assert 'if not generated_yaml["found"] and snmp2mqtt_applicability["applicable"]:' in source
          assert '"snmp2mqtt_applicability": snmp2mqtt_applicability' in source
          assert 'id="generatedYamlDescription"' in web._PAGE
          assert 'id="generatedYamlActions"' in web._PAGE
          assert 'id="regenerateYamlHelp"' in web._PAGE
          assert "d.applicable!==false" in web._PAGE
          assert "regen.hidden=true" in web._PAGE
          assert "Not in use · no enabled SNMP targets" in web._PAGE

          web._self_addon_options = lambda: {
              "generate_snmp2mqtt": "true",
              "parse_all_walks": "false",
              "switches": [{
                  "switch_name": "SW1",
                  "switch_host": "192.0.2.10",
                  "enabled": "enabled",
              }],
          }
          status = web._generated_yaml_status()
          assert status["applicable"] is True
          assert status["validation"]["valid"] is False
          assert "not found" in status["validation"]["error"].lower()

          web._self_addon_options = lambda: {
              "generate_snmp2mqtt": "false",
              "parse_all_walks": "false",
              "switches": [{
                  "switch_name": "SW1",
                  "switch_host": "192.0.2.10",
                  "enabled": "enabled",
              }],
          }
          status = web._generated_yaml_status()
          assert status["applicable"] is False
          assert "disabled" in status["reason"].lower()
          print("Switch Vision Discovery v2.1.36 UniFi-only SNMP2MQTT status regression: PASS")
          PYTEST_V2136_UNIFI_ONLY
          ''')
          if 'PYTEST_V2136_UNIFI_ONLY' in tests:
              raise SystemExit('v2.1.36 regression already exists')
          self_test.write_text(tests.rstrip() + regression, encoding='utf-8', newline='\n')

          changelog = Path('switch_vision_discovery/CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          if not old.startswith('# Changelog\n\n## 2.1.35'):
              raise SystemExit('Unexpected Discovery changelog head')
          entry = dedent('''\
          ## 2.1.36

          - Treat generated SNMP2MQTT YAML as **Not applicable** when no enabled SNMP switch targets are configured, including UniFi2MQTT-only installations.
          - Remove the false missing-YAML warning from diagnostics when the SNMP data path is not in use.
          - Hide SNMP2MQTT YAML regeneration/preview/download controls when they are irrelevant, while keeping SNMP cleanup available for users retiring old SNMP state.
          - Show the live SNMP2MQTT state as **Not in use** instead of **Waiting** on UniFi-only installations.
          - Preserve strict missing/invalid generated-YAML validation whenever at least one enabled SNMP target is actually configured.
          - Add a packaged regression covering UniFi-only, active-SNMP, and generator-disabled status behavior.

          ''')
          changelog.write_text('# Changelog\n\n' + entry + old[len('# Changelog\n\n'):], encoding='utf-8', newline='\n')
          PY

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C runtime_src . | gzip -n > switch_vision_discovery/runtime.tar.gz

          rm -f .github/workflows/prepare-discovery-v2136-unifi-status.yml

      - name: Validate Discovery 2.1.36
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_runtime_parity.py
          sh runtime_src/self-test.sh
          python -m py_compile \
            runtime_src/support_web.py \
            runtime_src/registry_lookup.py \
            runtime_src/vendor_sensor_scan.py \
            runtime_src/unifi_dashboard_cards.py
          grep -q '^version: "2.1.36"$' switch_vision_discovery/config.yaml
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION="2.1.36"' runtime_src/run.sh
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION="2.1.36"' runtime_src/discovery_job.sh
          grep -q 'Not applicable' runtime_src/support_web.py
          grep -q 'UniFi2MQTT-only installations do not require generated SNMP2MQTT YAML' runtime_src/support_web.py
          find runtime_src -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit tested Discovery 2.1.36 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Switch Vision Discovery v2.1.36 UniFi-only status fix'
          git push origin HEAD:fix/unifi-only-snmp-status-v2136-final
