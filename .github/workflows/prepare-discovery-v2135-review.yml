name: Prepare Discovery v2.1.35 review release

on:
  push:
    branches:
      - review/sv-2026-000002-registry-sync

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML websockets

      - name: Prepare Discovery 2.1.35 metadata and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          for path in [
              Path('switch_vision_discovery/config.yaml'),
              Path('runtime_src/run.sh'),
              Path('runtime_src/discovery_job.sh'),
              Path('runtime_src/self-test.sh'),
          ]:
              text = path.read_text(encoding='utf-8')
              if '2.1.34' not in text:
                  raise SystemExit(f'Expected 2.1.34 version marker missing from {path}')
              path.write_text(text.replace('2.1.34', '2.1.35'), encoding='utf-8', newline='\n')

          changelog = Path('switch_vision_discovery/CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          if not old.startswith('# Changelog\n\n## 2.1.34'):
              raise SystemExit('Unexpected Discovery changelog head')
          entry = dedent('''\
          ## 2.1.35

          - Synchronize the reviewed Core exact-model registry for Support My Switch contribution `SV-2026-000002` and preserve the validated Zyxel XS1930-10 contributor evidence.
          - Add UniFi API profiles for `US 48`, optical-first `US XG 16`, and 32-port optical `USW Pro Aggregation`.
          - Keep `US 48` on the existing legacy sequential 48-RJ45 + four-optical dashboard path as backward-compatibility coverage.
          - Recognize `US XG 16` and `USW Pro Aggregation` without generating fake dashboard cards while their exact faceplates remain unverified; generated output records that they are waiting for visuals.
          - Recognize SFP28 as an optical connector class and preserve 25G maximum capability separately from current negotiated link speed.
          - Forward explicit `unifi_api_port_map` metadata into generated cards when a future exact model is dashboard-enabled, while retaining `unifi_sfp_port_offset` compatibility.
          - Add packaged runtime regressions for the contribution registry, API profiles, pending-visual behavior, and generated-card contracts.

          ''')
          changelog.write_text('# Changelog\n\n' + entry + old[len('# Changelog\n\n'):], encoding='utf-8', newline='\n')
          PY

          # Rebuild the tracked runtime archive deterministically from the
          # reviewable runtime_src tree.
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C runtime_src . | gzip -n > switch_vision_discovery/runtime.tar.gz

          # Never retain this one-shot workflow in the product branch.
          rm -f .github/workflows/prepare-discovery-v2135-review.yml

      - name: Validate Discovery 2.1.35
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_runtime_parity.py
          sh runtime_src/self-test.sh
          python -m py_compile \
            runtime_src/support_web.py \
            runtime_src/registry_lookup.py \
            runtime_src/vendor_sensor_scan.py \
            runtime_src/unifi_dashboard_cards.py

          grep -q '^version: "2.1.35"$' switch_vision_discovery/config.yaml
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION="2.1.35"' runtime_src/run.sh
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION="2.1.35"' runtime_src/discovery_job.sh
          grep -q 'SWITCH_VISION_DISCOVERY_VERSION=\\"2.1.35\\"' runtime_src/self-test.sh

          find runtime_src -type d -name '__pycache__' -prune -exec rm -rf {} +
          find runtime_src -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit tested Discovery 2.1.35 review source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Switch Vision Discovery v2.1.35 public release'
          git push origin HEAD:review/sv-2026-000002-registry-sync
