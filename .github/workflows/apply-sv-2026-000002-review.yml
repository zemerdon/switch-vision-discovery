name: Repair SV-2026-000002 Discovery Registry Parity

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair-registry-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/sv-2026-000002-registry-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML websockets

      - name: Preserve validated XS1930 entry from Discovery main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("runtime_src/opt/switch-vision/devices/supported_devices.json")
          current = json.loads(path.read_text(encoding="utf-8"))
          main = json.loads(
              subprocess.check_output(
                  [
                      "git",
                      "show",
                      "origin/main:runtime_src/opt/switch-vision/devices/supported_devices.json",
                  ]
              )
          )

          def by_model(registry):
              return {
                  item["model"]: item
                  for item in registry["devices"]
                  if isinstance(item, dict) and item.get("model")
              }

          current_models = by_model(current)
          main_models = by_model(main)
          validated = main_models["XS1930-10"]

          replaced = False
          for index, item in enumerate(current["devices"]):
              if item.get("model") == "XS1930-10":
                  current["devices"][index] = validated
                  replaced = True
                  break
          assert replaced, "XS1930-10 missing from review registry"

          path.write_text(
              json.dumps(current, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          repaired = json.loads(path.read_text(encoding="utf-8"))
          repaired_models = by_model(repaired)
          assert repaired_models["XS1930-10"] == validated
          assert set(repaired_models) == set(current_models)
          assert len(repaired_models) == 31

          changed = [
              model
              for model in sorted(repaired_models)
              if repaired_models[model] != current_models[model]
          ]
          assert changed in ([], ["XS1930-10"]), changed
          print(f"Discovery XS1930 registry parity repair: PASS ({changed or ['already_repaired']})")
          PY

      - name: Rebuild runtime and run packaged regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -f switch_vision_discovery/runtime.tar.gz
          tar -czf switch_vision_discovery/runtime.tar.gz -C runtime_src .
          python3 tools/check_runtime_parity.py
          sh runtime_src/self-test.sh
          git diff --check

      - name: Verify contribution and parity contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path("runtime_src/opt/switch-vision/devices/supported_devices.json").read_text(
                  encoding="utf-8"
              )
          )
          models = {item["model"]: item for item in registry["devices"]}
          assert len(models) == 31

          xs = models["XS1930-10"]
          assert xs["confirmed_since"] == "2.1.7"
          assert xs["last_validated_version"] == "2.1.7"
          assert xs["evidence"] == "support_my_switch_contribution_SV-2026-000004_plus_vendor_MIB_pack"
          assert xs["tested_firmware"] == ["V4.80(ABQE.5)"]
          assert xs["contributor"] == {"display_name": "jpedrot", "public_credit": True}

          xg = models["US XG 16"]
          assert xg["status"] == "detected"
          assert xg["dashboard_support"] is False
          assert xg["unifi_api_port_map"] == {
              "rj45": [13, 14, 15, 16],
              "sfp": list(range(1, 13)),
          }

          proagg = models["USW Pro Aggregation"]
          assert proagg["status"] == "detected"
          assert proagg["dashboard_support"] is False
          assert proagg["ports"]["ten_gigabit_sfp_plus"] == 28
          assert proagg["ports"]["twenty_five_gigabit_sfp28"] == 4

          print("Discovery SV-2026-000002 + XS1930 parity contracts: PASS")
          PY

      - name: Commit verified parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "switch-vision-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            runtime_src/opt/switch-vision/devices/supported_devices.json \
            switch_vision_discovery/runtime.tar.gz
          if git diff --cached --quiet; then
            echo "No Discovery registry parity changes to commit."
            exit 0
          fi
          git commit -m "Preserve validated XS1930 Discovery evidence"
          git push origin HEAD:review/sv-2026-000002-registry-sync
