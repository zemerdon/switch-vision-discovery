name: Temporary prepare Discovery 2.1.42

on:
  push:
    branches:
      - main
    paths:
      - .github/v2142-trigger.txt

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/discovery-2.1.42-c3750-profile
          fetch-depth: 0
      - name: Fetch preparer script from main
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/v2142_prepare.py > /tmp/v2142_prepare.py
      - name: Apply and smoke-test Discovery 2.1.42
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v2142_prepare.py
          python3 -m py_compile tools/check_component_contracts.py tools/test_c3750_48p_contract.py tools/test_c3750_48p_live_mapping.py
          python3 tools/test_c3750_48p_contract.py
          python3 tools/test_c3750_48p_live_mapping.py
          git status --short
      - name: Commit review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Discovery 2.1.42: fix Catalyst 3750 live 48+4 mapping"
          git push origin HEAD:fix/discovery-2.1.42-c3750-profile
