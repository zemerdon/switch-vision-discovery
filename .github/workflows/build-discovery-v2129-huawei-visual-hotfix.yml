name: Build Discovery v2.1.29 Huawei visual hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotfix/discovery-2.1.29-huawei-visual-defaults' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML websockets
      - name: Prepare Discovery 2.1.29
        run: python3 tools/prepare_discovery_v2129.py
      - name: Rebuild packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, tarfile
          src=Path('runtime_src')
          out=Path('switch_vision_discovery/runtime.tar.gz')
          with out.open('wb') as raw:
              with gzip.GzipFile(filename='',mode='wb',fileobj=raw,mtime=0) as gz:
                  with tarfile.open(fileobj=gz,mode='w',format=tarfile.PAX_FORMAT) as tf:
                      for path in sorted(src.rglob('*'), key=lambda p:p.as_posix()):
                          arc=path.relative_to(src).as_posix()
                          info=tf.gettarinfo(str(path),arcname=arc)
                          info.mtime=0; info.uid=0; info.gid=0; info.uname=''; info.gname=''
                          if path.is_file():
                              with path.open('rb') as fh: tf.addfile(info,fh)
                          else:
                              tf.addfile(info)
          PY
      - name: Validate Discovery 2.1.29
        shell: bash
        run: |
          set -euo pipefail
          sh -n runtime_src/run.sh
          sh -n runtime_src/discovery_job.sh
          sh runtime_src/self-test.sh
          python3 tools/check_runtime_parity.py
          python3 tools/check_speed_contracts.py
          python3 -m py_compile runtime_src/support_web.py runtime_src/generated_yaml_guard.py tools/check_component_contracts.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('runtime_src/opt/switch-vision/devices/supported_devices.json').read_text())
          models={str(x.get('model')):x for x in doc.get('devices',[]) if isinstance(x,dict)}
          for model in ('S5720-12TP-LI-AC','S5735-L8P4X-A1'):
              d=models[model]
              assert d['calibration_profile']=='stock_24rj45_4sfp'
              assert d['default_faceplate']=='faceplates/24rj45-4sfp.png'
              assert d['visuals']['calibration_profile']=='stock_24rj45_4sfp'
              assert d['visuals']['recommended_faceplate']=='faceplates/24rj45-4sfp.png'
          assert 'version: "2.1.29"' in Path('switch_vision_discovery/config.yaml').read_text()
          assert 'SWITCH_VISION_DISCOVERY_VERSION="2.1.29"' in Path('runtime_src/run.sh').read_text()
          assert 'SWITCH_VISION_DISCOVERY_VERSION="2.1.29"' in Path('runtime_src/discovery_job.sh').read_text()
          print('Discovery 2.1.29 Huawei visual contract: PASS')
          PY
          git diff --check
      - name: Remove temporary builder and helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-discovery-v2129-huawei-visual-hotfix.yml tools/prepare_discovery_v2129.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
      - name: Commit Discovery 2.1.29 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'ERROR: Discovery 2.1.29 builder produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Discovery v2.1.29: restore Huawei visual defaults'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
