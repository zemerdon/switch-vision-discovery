name: Debug Discovery v2.1.26 self-test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug:
    if: ${{ github.event.pull_request.head.ref == 'fix/discovery-2.1.26-audit-contracts' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null && python3 -m pip install --disable-pip-version-check PyYAML websockets >/dev/null
      - name: Trace packaged self-test
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/switch-vision-discovery-runtime"
          mkdir -p "$runtime_dir"
          tar -xzf switch_vision_discovery/runtime.tar.gz -C "$runtime_dir"
          sh -x "$runtime_dir/self-test.sh"
